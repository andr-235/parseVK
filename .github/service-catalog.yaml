{
  "schema_version": 2,
  "global_change_paths": {
    "pytest": [
      "pyproject.toml",
      "libs/py/common/",
      "libs/py/contracts/"
    ],
    "audit": [
      "pyproject.toml",
      "libs/py/common/",
      "libs/py/contracts/"
