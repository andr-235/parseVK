name: AsyncAPI Validation

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/asyncapi-validator/**'
      - '.github/scripts/validate-asyncapi.sh'
      - '.github/scripts/validate-asyncapi.mjs'
      - '.github/workflows/asyncapi-validation.yml'
      - 'libs/py/contracts/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: asyncapi-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate Generated AsyncAPI
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate validator lock
        run: >-
          npm install
          --prefix .github/asyncapi-validator
          --package-lock-only
          --ignore-scripts
          --no-audit
          --no-fund
      - name: Commit generated validator lock once
        if: >-
          github.event_name == 'pull_request' &&
          github.actor == 'andr-235' &&
          github.event.pull_request.head.repo.full_name == github.repository
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/asyncapi-validator/package-lock.json
          if git diff --cached --quiet; then
            echo "Validator lock is already committed."
            exit 0
          fi
          git commit -m "build(contracts): lock AsyncAPI validator dependencies"
          git push origin "HEAD:${HEAD_REF}"
      - name: Install contract dependencies
        working-directory: libs/py/contracts
        run: uv sync --group dev --frozen
      - name: Regenerate AsyncAPI
        working-directory: libs/py/contracts
        run: >-
          uv run python -c
          "from parsevk_contracts.generation import generate_all;
          from parsevk_contracts.vk.commands import CATALOG;
          generate_all(CATALOG)"
      - name: Validate AsyncAPI with diagnostics
        run: >-
          bash .github/scripts/validate-asyncapi.sh
          libs/py/contracts/generated/asyncapi/parsevk-contracts.yaml
