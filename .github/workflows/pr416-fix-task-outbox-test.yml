name: Patch PR416 task fixtures

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/pr416-fix-task-outbox-test.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Replace removed fixtures and SQL mock counts
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          outbox_path = Path("services/tasks-service/tests/test_outbox.py")
          text = outbox_path.read_text()
          text = text.replace(
              '''    source_adapter = SimpleNamespace(
                  ensure_normalized_sources=AsyncMock()
              )
              service.crud.source_adapter_factory = lambda _session: source_adapter
          ''',
              '''    source_resolver = SimpleNamespace(resolve=AsyncMock())
              service.crud.source_resolver_factory = lambda _session: source_resolver
          ''',
          )
          text = text.replace(
              '''    source_adapter.ensure_normalized_sources.assert_awaited_once_with(
                  task_mock,
                  [1, 2],
              )
          ''',
              '''    source_resolver.resolve.assert_awaited_once_with(
                  task_mock,
                  [1, 2],
              )
          ''',
          )
          marker = '''def test_payload_has_no_sensitive_keys():
          '''
          addition = '''def test_kafka_key_for_vk_cancel_command_uses_execution_id():
              execution_id = str(uuid4())
              assert (
                  kafka_key_for_event(
                      "vk.execution.cancel_requested",
                      {"executionId": execution_id},
                      "ignored",
                  )
                  == execution_id
              )


          '''
          if addition not in text:
              text = text.replace(marker, addition + marker)
          outbox_path.write_text(text)

          consumer_path = Path(
              "services/tasks-service/tests/test_execution_consumer.py"
          )
          text = consumer_path.read_text()
          text = text.replace(
              '''    results.extend([_mock_result_task_row(row), MagicMock()])
          ''',
              '''    results.extend(
                  [_mock_result_task_row(row), *[MagicMock() for _ in range(4)]]
              )
          ''',
          )
          text = text.replace(
              '''    assert session.execute.await_count == 3
              assert session.commit.await_count == 1

              added_models = [call.args[0] for call in session.add.call_args_list]
              state_events = [m for m in added_models if getattr(m, "event_type", None) == "task.state_changed"]
              assert len(state_events) == 1
              assert state_events[0].payload["status"] == "running"
          ''',
              '''    assert session.execute.await_count == 4
              assert session.commit.await_count == 1

              added_models = [call.args[0] for call in session.add.call_args_list]
              state_events = [
                  model
                  for model in added_models
                  if getattr(model, "event_type", None) == "task.state_changed"
              ]
              assert len(state_events) == 1
              assert state_events[0].payload["status"] == "running"
          ''',
              1,
          )
          consumer_path.write_text(text)
          PY
          rm .github/workflows/pr416-fix-task-outbox-test.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            services/tasks-service/tests/test_outbox.py \
            services/tasks-service/tests/test_execution_consumer.py \
            .github/workflows/pr416-fix-task-outbox-test.yml
          git commit -m "test(tasks): align canonical runtime fixtures"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
