name: Rollback Deployment

on:
  workflow_dispatch:
    inputs:
      target_commit:
        description: "Commit hash to rollback to (leave empty for previous successful release)"
        required: false
        type: string
      skip_health_check:
        description: "Skip health checks after rollback"
        required: false
        type: boolean
        default: false

concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  rollback:
    name: Rollback to Local Release
    runs-on: [self-hosted]
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      DOCKER_BUILDKIT: 1
      COMPOSE_DOCKER_CLI_BUILD: 1
      COMPOSE_FILE: docker-compose.yml
      COMPOSE_PROJECT_NAME: parsevk
      PROJECT_ROOT: /opt/parseVK
      PRODUCTION_SCRIPTS_DIR: ${{ github.workspace }}/.github/scripts/production
      SERVICE_CATALOG_CLI: ${{ github.workspace }}/.github/scripts/service_catalog.py
      LOCAL_RELEASE_SCRIPT: ${{ github.workspace }}/.github/scripts/production/local-release.sh
      HEALTH_CHECK_SCRIPT: ${{ github.workspace }}/.github/scripts/health-check.sh
      HTTP_HEALTH_CHECK_SCRIPT: ${{ github.workspace }}/.github/scripts/http-health-check.sh
      PULL_POLICY: never

    steps:
      - name: Checkout workflow scripts
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          ref: main
          persist-credentials: false

      - name: Load deployment metadata
        id: load_metadata
        working-directory: /opt/parseVK
        run: |
          set -euo pipefail
          PROJECT_ROOT="$PROJECT_ROOT" COMPOSE_FILE="$COMPOSE_FILE" GITHUB_OUTPUT="$GITHUB_OUTPUT" \
            bash "$PRODUCTION_SCRIPTS_DIR/metadata.sh" load

      - name: Determine target release
        id: determine_commit
        working-directory: /opt/parseVK
        run: |
          set -euo pipefail

          TARGET_COMMIT="${{ github.event.inputs.target_commit }}"
          if [ -z "$TARGET_COMMIT" ]; then
            TARGET_COMMIT="${{ steps.load_metadata.outputs.previous_successful_commit }}"
          fi

          if [ -z "$TARGET_COMMIT" ] || [ "$TARGET_COMMIT" = "null" ]; then
            echo "Error: No target commit specified and no previous successful release found"
            exit 1
          fi

          if ! git fetch --no-tags origin "$TARGET_COMMIT"; then
            echo "Error: Failed to fetch target commit $TARGET_COMMIT"
            exit 1
          fi
          if ! git cat-file -e "${TARGET_COMMIT}^{commit}" 2>/dev/null; then
            echo "Error: Commit $TARGET_COMMIT does not exist"
            exit 1
          fi

          echo "target_commit=$TARGET_COMMIT" >> "$GITHUB_OUTPUT"
          echo "Rolling back to local release: $TARGET_COMMIT"

      - name: Save current deployment state
        id: save_state
        working-directory: /opt/parseVK
        run: |
          set -euo pipefail

          CURRENT_COMMIT="${{ steps.load_metadata.outputs.last_successful_commit }}"
          CURRENT_TIME="$(date -u +"%Y-%m-%dT%H:%M:%SZ")"
          STATE_FILE="/opt/parseVK/.rollback-state.json"

          jq -n \
            --arg from "$CURRENT_COMMIT" \
            --arg to "${{ steps.determine_commit.outputs.target_commit }}" \
            --arg time "$CURRENT_TIME" \
            --arg actor "${{ github.actor }}" \
            --arg run_id "${{ github.run_id }}" \
            '{rollback_from_commit:$from, rollback_to_commit:$to, rollback_time:$time, rollback_triggered_by:$actor, rollback_run_id:$run_id}' \
            > "$STATE_FILE"

          echo "current_commit=$CURRENT_COMMIT" >> "$GITHUB_OUTPUT"
          echo "Saved rollback state to $STATE_FILE"

      - name: Checkout target commit
        working-directory: /opt/parseVK
        run: |
          set -euo pipefail
          TARGET_COMMIT="${{ steps.determine_commit.outputs.target_commit }}"
          git checkout -f "$TARGET_COMMIT"
          echo "Checked out commit: $TARGET_COMMIT"

      - name: Stage and validate rollback tools
        working-directory: /opt/parseVK
        timeout-minutes: 2
        run: |
          set -euo pipefail
          PROJECT_ROOT="$PROJECT_ROOT" COMPOSE_FILE="$COMPOSE_FILE" \
            bash "$PRODUCTION_SCRIPTS_DIR/preflight.sh"

      - name: Verify target local release
        working-directory: /opt/parseVK
        timeout-minutes: 2
        run: |
          set -euo pipefail
          PROJECT_ROOT="$PROJECT_ROOT" COMPOSE_FILE="$COMPOSE_FILE" COMPOSE_PROJECT_NAME="$COMPOSE_PROJECT_NAME" \
            SERVICE_CATALOG_CLI="$SERVICE_CATALOG_CLI" bash "$LOCAL_RELEASE_SCRIPT" verify \
            "${{ steps.determine_commit.outputs.target_commit }}"

      - name: Activate local release images
        id: activate
        working-directory: /opt/parseVK
        run: |
          set -euo pipefail
          PROJECT_ROOT="$PROJECT_ROOT" COMPOSE_FILE="$COMPOSE_FILE" COMPOSE_PROJECT_NAME="$COMPOSE_PROJECT_NAME" \
            SERVICE_CATALOG_CLI="$SERVICE_CATALOG_CLI" bash "$LOCAL_RELEASE_SCRIPT" activate \
            "${{ steps.determine_commit.outputs.target_commit }}"

      - name: Start rollback release
        working-directory: /opt/parseVK
        timeout-minutes: 10
        run: |
          set -euo pipefail
          PROJECT_ROOT="$PROJECT_ROOT" COMPOSE_FILE="$COMPOSE_FILE" PULL_POLICY="$PULL_POLICY" \
            UP_ARGS="-d --no-build" bash "$PRODUCTION_SCRIPTS_DIR/release.sh"

      - name: Wait for services to be healthy
        if: github.event.inputs.skip_health_check != 'true'
        working-directory: /opt/parseVK
        timeout-minutes: 5
        run: |
          set -euo pipefail
          COMPOSE_FILE="$COMPOSE_FILE" bash "$HEALTH_CHECK_SCRIPT"

      - name: HTTP health check
        if: github.event.inputs.skip_health_check != 'true'
        working-directory: /opt/parseVK
        timeout-minutes: 3
        run: |
          set -euo pipefail
          COMPOSE_FILE="$COMPOSE_FILE" bash "$HTTP_HEALTH_CHECK_SCRIPT"

      - name: Update deployment metadata
        working-directory: /opt/parseVK
        run: |
          set -euo pipefail
          TARGET_COMMIT="${{ steps.determine_commit.outputs.target_commit }}"
          CURRENT_TIME="$(date -u +"%Y-%m-%dT%H:%M:%SZ")"
          PROJECT_ROOT="$PROJECT_ROOT" COMPOSE_FILE="$COMPOSE_FILE" \
            bash "$PRODUCTION_SCRIPTS_DIR/metadata.sh" write "$TARGET_COMMIT" "$CURRENT_TIME"

      - name: Restore original local release after failed rollback
        if: failure() && steps.activate.outcome == 'success' && steps.save_state.outputs.current_commit != ''
        working-directory: /opt/parseVK
        timeout-minutes: 10
        run: |
          set -euo pipefail
          CURRENT_COMMIT="${{ steps.save_state.outputs.current_commit }}"
          echo "Rollback failed; restoring original release $CURRENT_COMMIT"
          git fetch --no-tags origin "$CURRENT_COMMIT"
          git checkout -f "$CURRENT_COMMIT"
          PROJECT_ROOT="$PROJECT_ROOT" COMPOSE_FILE="$COMPOSE_FILE" COMPOSE_PROJECT_NAME="$COMPOSE_PROJECT_NAME" \
            SERVICE_CATALOG_CLI="$SERVICE_CATALOG_CLI" bash "$LOCAL_RELEASE_SCRIPT" activate "$CURRENT_COMMIT"
          PROJECT_ROOT="$PROJECT_ROOT" COMPOSE_FILE="$COMPOSE_FILE" PULL_POLICY="$PULL_POLICY" \
            UP_ARGS="-d --no-build" bash "$PRODUCTION_SCRIPTS_DIR/release.sh"

      - name: Rollback summary
        if: always()
        run: |
          echo "=== Rollback Summary ==="
          echo "Target commit: ${{ steps.determine_commit.outputs.target_commit }}"
          echo "Rollback time: $(date -u +"%Y-%m-%dT%H:%M:%SZ")"
          echo "Triggered by: ${{ github.actor }}"
          echo "Run ID: ${{ github.run_id }}"
