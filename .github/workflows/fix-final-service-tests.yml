name: Fix Final Service Tests

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/fix-final-service-tests.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/full-release-validation
      - uses: astral-sh/setup-uv@v5
      - name: Fix tasks sequence fixture
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("services/tasks-service/tests/test_execution_consumer.py")
          text = path.read_text(encoding="utf-8")
          old = '''async def test_apply_started_from_running_does_not_emit():
              session = _mock_session_with_task_row(_make_task_row(status="running"), include_duplicate_check=False)
          '''
          new = '''async def test_apply_started_from_running_does_not_emit():
              session = _mock_session_with_task_row(
                  _make_task_row(status="running", last_seq=1),
                  include_duplicate_check=False,
              )
          '''
          if old not in text:
              raise SystemExit("tasks sequence fixture anchor not found")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY
      - name: Replace Telegram lifecycle test storage boundary
        run: |
          set -euo pipefail
          cat > services/telegram-service/tests/test_telegram_service.py <<'PY'
          import asyncio
          from datetime import UTC, datetime
          from unittest.mock import AsyncMock, MagicMock
          from uuid import UUID, uuid4

          import pytest
          from app.main import app as telegram_app
          from app.modules.telegram_service.router import get_service
          from app.modules.telegram_service.service import TelegramServiceService
          from httpx import ASGITransport, AsyncClient


          class InMemoryTelegramRepository:
              def __init__(self) -> None:
                  self.jobs: dict[UUID, dict] = {}
                  self.logs: dict[UUID, list[dict]] = {}

              async def create_job(self, params: dict, total_count: int) -> dict:
                  job_id = uuid4()
                  job = {
                      "id": str(job_id),
                      "status": "pending",
                      "fetchedCount": 0,
                      "totalCount": total_count,
                      "progress": 0,
                      "warning": None,
                      "error": None,
                      "xlsxPath": None,
                      "createdAt": datetime.now(UTC).isoformat(),
                      "params": params,
                  }
                  self.jobs[job_id] = job
                  self.logs[job_id] = []
                  return dict(job)

              async def get_job(self, job_id: UUID) -> dict | None:
                  job = self.jobs.get(job_id)
                  return dict(job) if job else None

              async def update_job(self, job_id: UUID, data: dict) -> None:
                  self.jobs[job_id].update(data)

              async def add_log(self, job_id: UUID, level: str, message: str) -> dict:
                  log = {
                      "id": str(uuid4()),
                      "level": level,
                      "message": message,
                      "createdAt": datetime.now(UTC).isoformat(),
                  }
                  self.logs[job_id].append(log)
                  return dict(log)

              async def get_logs(self, job_id: UUID) -> list[dict]:
                  return [dict(log) for log in self.logs.get(job_id, [])]


          @pytest.fixture
          def app():
              return telegram_app


          @pytest.fixture(autouse=True)
          def mock_db_connection(monkeypatch):
              import app.db.session

              mock_conn = AsyncMock()
              mock_conn.execute.return_value = MagicMock()

              mock_connect = MagicMock()
              mock_connect.__aenter__.return_value = mock_conn

              mock_engine = MagicMock()
              mock_engine.connect.return_value = mock_connect

              monkeypatch.setattr(app.db.session, "engine", mock_engine)


          @pytest.fixture
          def service(monkeypatch) -> TelegramServiceService:
              repository = InMemoryTelegramRepository()
              telegram_service = TelegramServiceService(repository)

              async def complete_export(job_id: UUID, params: dict, total_count: int) -> None:
                  await repository.update_job(job_id, {"status": "running"})
                  await repository.add_log(job_id, "info", "Экспорт запущен")
                  await repository.update_job(
                      job_id,
                      {
                          "status": "done",
                          "fetchedCount": total_count,
                          "progress": 100,
                          "xlsxPath": f"/downloads/telegram_export_{job_id}.xlsx",
                      },
                  )

              monkeypatch.setattr(telegram_service, "run_export_job", complete_export)
              return telegram_service


          @pytest.fixture(autouse=True)
          def override_service_dependency(service: TelegramServiceService):
              telegram_app.dependency_overrides[get_service] = lambda: service
              yield
              telegram_app.dependency_overrides.pop(get_service, None)


          @pytest.fixture
          async def client(app):
              transport = ASGITransport(app=app)
              async with AsyncClient(transport=transport, base_url="http://test") as ac:
                  yield ac


          @pytest.mark.asyncio
          async def test_health(client: AsyncClient):
              response = await client.get("/health")
              assert response.status_code == 200
              assert response.json() == {"status": "UP"}


          @pytest.mark.asyncio
          async def test_ready(client: AsyncClient):
              response = await client.get("/ready")
              assert response.status_code == 200
              assert response.json() == {"status": "READY"}


          @pytest.mark.asyncio
          async def test_telegram_export_lifecycle(client: AsyncClient):
              headers = {"X-Internal-Service-Token": "dev-internal-token"}
              payload = {
                  "target": "https://t.me/test_group",
                  "limit": 100,
                  "activeOnly": True,
                  "verifyPhones": False,
              }

              response = await client.post("/internal/telegram/export", json=payload, headers=headers)
              assert response.status_code == 201
              data = response.json()
              assert "jobId" in data
              assert data["status"] == "pending"

              job_id = data["jobId"]
              job_data = None
              for _ in range(20):
                  response = await client.get(f"/internal/telegram/jobs/{job_id}", headers=headers)
                  assert response.status_code == 200
                  job_data = response.json()
                  if job_data["job"]["status"] == "done":
                      break
                  await asyncio.sleep(0.01)

              assert job_data is not None
              assert job_data["job"]["id"] == job_id
              assert job_data["job"]["status"] == "done"
              assert job_data["job"]["fetchedCount"] == 100
              assert len(job_data["logs"]) == 1
          PY
      - name: Run targeted tests and Ruff
        run: |
          set -euo pipefail
          uvx ruff check \
            services/tasks-service/tests/test_execution_consumer.py \
            services/telegram-service/tests/test_telegram_service.py
          (
            cd services/tasks-service
            uv sync --extra test --frozen
            uv run pytest -q tests/test_execution_consumer.py
          )
          (
            cd services/telegram-service
            uv sync --extra test --frozen
            uv run pytest -q tests/test_telegram_service.py
          )
      - name: Commit fixes
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email github-actions[bot]@users.noreply.github.com
          git add \
            services/tasks-service/tests/test_execution_consumer.py \
            services/telegram-service/tests/test_telegram_service.py
          git commit -m "test: align final lifecycle fixtures"
          git push origin HEAD:fix/full-release-validation
