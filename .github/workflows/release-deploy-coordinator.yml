name: Release Deploy Coordinator

on:
  workflow_run:
    workflows: ["Release"]
    types:
      - completed
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: release-deploy-coordinator
  cancel-in-progress: false

jobs:
  dispatch:
    name: Publish And Deploy Validated Release
    runs-on: ubuntu-latest
    timeout-minutes: 350
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == 'main'
      )

    steps:
      - name: Checkout release history and resolver
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
          sparse-checkout: |
            .github/scripts/latest_release.py
            .github/scripts/cancel-superseded-deploys.sh
          sparse-checkout-cone-mode: false

      - name: Resolve latest semantic release
        id: release
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail

          RELEASE_JSON="$(python .github/scripts/latest_release.py --ref HEAD)"
          RELEASE_SHA="$(jq -r '.release_sha' <<<"$RELEASE_JSON")"
          RELEASE_PARENT="$(jq -r '.source_sha' <<<"$RELEASE_JSON")"

          if [[ "$EVENT_NAME" == "workflow_run" && "$RELEASE_PARENT" != "$SOURCE_SHA" ]]; then
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            echo "Release run source $SOURCE_SHA is stale; latest release $RELEASE_SHA has parent $RELEASE_PARENT"
            exit 0
          fi

          {
            echo "proceed=true"
            echo "release_sha=$RELEASE_SHA"
            echo "source_sha=$RELEASE_PARENT"
          } >> "$GITHUB_OUTPUT"
          echo "Resolved latest semantic release reachable from main: $RELEASE_SHA"

      - name: Wait for release gates
        id: gates
        if: steps.release.outputs.proceed == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_SHA: ${{ steps.release.outputs.release_sha }}
        run: |
          set -euo pipefail

          latest_state() {
            local statuses="$1" context="$2"
            jq -r --arg context "$context" '
              [.[] | select(.context == $context)]
              | sort_by(.created_at)
              | last
              | if . == null then "missing" else (.state // "unknown") end
            ' <<<"$statuses"
          }

          for attempt in $(seq 1 75); do
            STATUSES="$(gh api \
              "repos/${GITHUB_REPOSITORY}/commits/${RELEASE_SHA}/statuses?per_page=100")"
            FULL_CI="$(latest_state "$STATUSES" release/full-ci)"
            SECURITY="$(latest_state "$STATUSES" release/security)"
            echo "release/full-ci=$FULL_CI release/security=$SECURITY"

            for result in "$FULL_CI" "$SECURITY"; do
              case "$result" in
                success|missing|pending) ;;
                *)
                  echo "::error::Release gate failed for $RELEASE_SHA: $result"
                  exit 1
                  ;;
              esac
            done

            if [[ "$FULL_CI" == "success" && "$SECURITY" == "success" ]]; then
              echo "ready=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 20
          done

          echo "::error::Timed out waiting for release gates for $RELEASE_SHA"
          exit 1

      - name: Dispatch immutable image publisher
        id: publisher
        if: steps.gates.outputs.ready == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_SHA: ${{ steps.release.outputs.release_sha }}
        run: |
          set -euo pipefail

          STATUSES="$(gh api \
            "repos/${GITHUB_REPOSITORY}/commits/${RELEASE_SHA}/statuses?per_page=100")"
          IMMUTABLE_STATE="$(jq -r '
            [.[] | select(.context == "release/immutable-ghcr")]
            | sort_by(.created_at)
            | last
            | if . == null then "missing" else (.state // "unknown") end
          ' <<<"$STATUSES")"
          IMMUTABLE_URL="$(jq -r '
            [.[] | select(.context == "release/immutable-ghcr")]
            | sort_by(.created_at)
            | last
            | if . == null then "" else (.target_url // "") end
          ' <<<"$STATUSES")"

          if [[ "$IMMUTABLE_STATE" == "success" ]]; then
            existing_id="${IMMUTABLE_URL##*/}"
            [[ "$existing_id" =~ ^[0-9]+$ ]] || {
              echo "::error::Immutable status has invalid target URL: $IMMUTABLE_URL"
              exit 1
            }
            echo "run_id=$existing_id" >> "$GITHUB_OUTPUT"
            echo "created=false" >> "$GITHUB_OUTPUT"
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "Immutable release already published: $IMMUTABLE_URL"
            exit 0
          fi

          previous="$(gh api --method GET \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/publish-release-images.yml/runs" \
            -f event=workflow_dispatch -f branch=main -f per_page=20 |
            jq -r '[.workflow_runs[]] | sort_by(.created_at) | last | .id // empty')"

          jq -nc --arg target "$RELEASE_SHA" --arg coordinator "$GITHUB_RUN_ID" '{
            ref: "main",
            inputs: {
              target_sha: $target,
              coordinator_run_id: $coordinator
            }
          }' | gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/publish-release-images.yml/dispatches" \
            --input -

          run_id=""
          for attempt in $(seq 1 20); do
            run_id="$(gh api --method GET \
              "repos/${GITHUB_REPOSITORY}/actions/workflows/publish-release-images.yml/runs" \
              -f event=workflow_dispatch -f branch=main -f per_page=20 |
              jq -r '[.workflow_runs[]] | sort_by(.created_at) | last | .id // empty')"
            if [[ -n "$run_id" && "$run_id" != "$previous" ]]; then
              break
            fi
            sleep 2
          done

          [[ -n "$run_id" && "$run_id" != "$previous" ]] || {
            echo "::error::GitHub did not create Publish Release Images run"
            exit 1
          }
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "created=true" >> "$GITHUB_OUTPUT"
          echo "ready=false" >> "$GITHUB_OUTPUT"
          echo "Publisher run: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${run_id}"

      - name: Wait for immutable publication
        id: publication
        if: steps.gates.outputs.ready == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_SHA: ${{ steps.release.outputs.release_sha }}
          PUBLISHER_RUN_ID: ${{ steps.publisher.outputs.run_id }}
          ALREADY_READY: ${{ steps.publisher.outputs.ready }}
        run: |
          set -euo pipefail

          if [[ "$ALREADY_READY" != "true" ]]; then
            completed=false
            for attempt in $(seq 1 720); do
              RUN="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${PUBLISHER_RUN_ID}")"
              STATUS="$(jq -r '.status' <<<"$RUN")"
              CONCLUSION="$(jq -r '.conclusion // ""' <<<"$RUN")"
              echo "Publisher: status=$STATUS conclusion=${CONCLUSION:-null} attempt=$attempt/720"
              if [[ "$STATUS" == "completed" ]]; then
                [[ "$CONCLUSION" == "success" ]] || {
                  echo "::error::Publisher failed: run=$PUBLISHER_RUN_ID conclusion=$CONCLUSION"
                  exit 1
                }
                completed=true
                break
              fi
              sleep 15
            done
            [[ "$completed" == "true" ]] || {
              echo "::error::Timed out waiting for Publisher run $PUBLISHER_RUN_ID"
              exit 1
            }
          fi

          STATUSES="$(gh api \
            "repos/${GITHUB_REPOSITORY}/commits/${RELEASE_SHA}/statuses?per_page=100")"
          IMMUTABLE_STATE="$(jq -r '
            [.[] | select(.context == "release/immutable-ghcr")]
            | sort_by(.created_at)
            | last
            | if . == null then "missing" else (.state // "unknown") end
          ' <<<"$STATUSES")"
          IMMUTABLE_URL="$(jq -r '
            [.[] | select(.context == "release/immutable-ghcr")]
            | sort_by(.created_at)
            | last
            | if . == null then "" else (.target_url // "") end
          ' <<<"$STATUSES")"
          EXPECTED_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${PUBLISHER_RUN_ID}"
          [[ "$IMMUTABLE_STATE" == "success" ]] || {
            echo "::error::Immutable publication status is $IMMUTABLE_STATE"
            exit 1
          }
          [[ "$IMMUTABLE_URL" == "$EXPECTED_URL" ]] || {
            echo "::error::Immutable status points to $IMMUTABLE_URL, expected $EXPECTED_URL"
            exit 1
          }
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Clean superseded production deploys
        id: cleanup
        if: steps.publication.outputs.ready == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_SHA: ${{ steps.release.outputs.release_sha }}
        run: bash .github/scripts/cancel-superseded-deploys.sh

      - name: Dispatch production deploy
        id: deploy
        if: >-
          steps.publication.outputs.ready == 'true' &&
          steps.cleanup.outcome == 'success'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_SHA: ${{ steps.release.outputs.release_sha }}
        run: |
          set -euo pipefail

          previous="$(gh api --method GET \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/deploy.yml/runs" \
            -f event=workflow_dispatch -f branch=main -f per_page=20 |
            jq -r '[.workflow_runs[]] | sort_by(.created_at) | last | .id // empty')"

          jq -nc --arg sha "$RELEASE_SHA" '{
            ref: "main",
            inputs: {deployment: "latest-release", expected_release_sha: $sha}
          }' | gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/deploy.yml/dispatches" \
            --input -

          run_id=""
          for attempt in $(seq 1 20); do
            run_id="$(gh api --method GET \
              "repos/${GITHUB_REPOSITORY}/actions/workflows/deploy.yml/runs" \
              -f event=workflow_dispatch -f branch=main -f per_page=20 |
              jq -r '[.workflow_runs[]] | sort_by(.created_at) | last | .id // empty')"
            if [[ -n "$run_id" && "$run_id" != "$previous" ]]; then
              break
            fi
            sleep 2
          done

          [[ -n "$run_id" && "$run_id" != "$previous" ]] || {
            echo "::error::GitHub did not create a production deploy run"
            exit 1
          }
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "Production run: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${run_id}"

      - name: Wait for production deploy
        id: production
        if: steps.deploy.outputs.run_id != ''
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEPLOY_RUN_ID: ${{ steps.deploy.outputs.run_id }}
        run: |
          set -euo pipefail

          for attempt in $(seq 1 360); do
            RUN="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${DEPLOY_RUN_ID}")"
            STATUS="$(jq -r '.status' <<<"$RUN")"
            CONCLUSION="$(jq -r '.conclusion // ""' <<<"$RUN")"
            echo "Production: status=$STATUS conclusion=${CONCLUSION:-null} attempt=$attempt/360"
            if [[ "$STATUS" == "completed" ]]; then
              [[ "$CONCLUSION" == "success" ]] || {
                echo "::error::Production deploy failed: run=$DEPLOY_RUN_ID conclusion=$CONCLUSION"
                exit 1
              }
              echo "ready=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 15
          done

          echo "::error::Timed out waiting for production deploy $DEPLOY_RUN_ID"
          exit 1

      - name: Coordinator summary
        if: always()
        shell: bash
        env:
          RELEASE_SHA: ${{ steps.release.outputs.release_sha }}
          PROCEED: ${{ steps.release.outputs.proceed }}
          PUBLISHER_RUN_ID: ${{ steps.publisher.outputs.run_id }}
          CLEANUP_OUTCOME: ${{ steps.cleanup.outcome }}
          DEPLOY_RUN_ID: ${{ steps.deploy.outputs.run_id }}
          PRODUCTION_READY: ${{ steps.production.outputs.ready }}
        run: |
          {
            echo "### Release deploy coordinator"
            echo "- Release SHA: \`${RELEASE_SHA:-not-resolved}\`"
            echo "- Eligible release: \`${PROCEED:-false}\`"
            echo "- Queue cleanup: \`${CLEANUP_OUTCOME:-not-run}\`"
            echo "- Production completed: \`${PRODUCTION_READY:-false}\`"
            if [[ -n "${PUBLISHER_RUN_ID:-}" ]]; then
              echo "- Publisher: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${PUBLISHER_RUN_ID}"
            fi
            if [[ -n "${DEPLOY_RUN_ID:-}" ]]; then
              echo "- Deploy: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${DEPLOY_RUN_ID}"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
