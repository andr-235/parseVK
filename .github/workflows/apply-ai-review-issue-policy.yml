name: Generate AI review issue policy

on:
  pull_request:
    branches:
      - main
    types: [synchronize]
    paths:
      - .github/workflows/apply-ai-review-issue-policy.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: test/ai-review-e2e
          fetch-depth: 0

      - name: Generate workflow
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('.github/scripts/apply_ai_review_issue_policy.py')
          text = path.read_text(encoding='utf-8')
          text = text.replace(
              '    prepare_step,\n    text,\n)',
              '    lambda _: prepare_step,\n    text,\n)',
              1,
          )
          text = text.replace(
              '    publish_step,\n    text,\n)',
              '    lambda _: publish_step,\n    text,\n)',
              1,
          )
          path.write_text(text, encoding='utf-8')
          PY

          python .github/scripts/apply_ai_review_issue_policy.py
          mkdir -p .github/generated
          cp .github/workflows/ai-code-review.yml .github/generated/ai-code-review.yml
          git restore .github/workflows/ai-code-review.yml

      - name: Commit generated blob
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/generated/ai-code-review.yml
          git commit -m "chore: generate AI review issue policy"
          git push origin HEAD:test/ai-review-e2e
