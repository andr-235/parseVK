name: Export AI review issue policy

on:
  pull_request:
    branches:
      - main
    types: [synchronize]
    paths:
      - .github/workflows/apply-ai-review-issue-policy.yml

permissions:
  contents: read

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: test/ai-review-e2e

      - name: Patch workflow
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('.github/scripts/apply_ai_review_issue_policy.py')
          text = path.read_text(encoding='utf-8')
          text = text.replace(
              '    prepare_step,\n    text,\n)',
              '    lambda _: prepare_step,\n    text,\n)',
              1,
          )
          text = text.replace(
              '    publish_step,\n    text,\n)',
              '    lambda _: publish_step,\n    text,\n)',
              1,
          )
          path.write_text(text, encoding='utf-8')
          PY
          python .github/scripts/apply_ai_review_issue_policy.py

      - name: Upload patched workflow
        uses: actions/upload-artifact@v4
        with:
          name: ai-review-issue-policy
          path: .github/workflows/ai-code-review.yml
          if-no-files-found: error
          retention-days: 1
