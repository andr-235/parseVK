name: P2 Regenerate Contracts

on:
  push:
    branches:
      - agent/p2-hardening-source-level-collections

permissions:
  contents: write

jobs:
  generate:
    if: ${{ !contains(github.event.head_commit.message, 'build(contracts): regenerate canonical artifacts') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: true
      - uses: astral-sh/setup-uv@v5
      - name: Regenerate contract artifacts
        working-directory: libs/py/contracts
        run: |
          uv sync --group dev --frozen
          uv run python -c "from parsevk_contracts.generation import generate_all; from parsevk_contracts.vk.commands import CATALOG; generate_all(CATALOG)"
      - name: Commit generated artifacts
        run: |
          if git diff --quiet -- libs/py/contracts/generated; then
            echo "Generated artifacts are already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add libs/py/contracts/generated
          git commit -m "build(contracts): regenerate canonical artifacts"
          git push
