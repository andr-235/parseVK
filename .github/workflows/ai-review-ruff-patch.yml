name: One-shot AI reviewer Ruff patch

on:
  pull_request:
    branches:
      - main
    types: [synchronize]

permissions:
  contents: write

jobs:
  patch:
    if: >-
      github.event.pull_request.head.ref == 'fix/ai-review-stability' &&
      github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout patch branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: fix/ai-review-stability
          fetch-depth: 0
          persist-credentials: true

      - name: Apply Ruff patch
        run: python .github/scripts/patch_ai_review_ruff.py

      - name: Run reviewer tests and Ruff
        env:
          PYTHONPATH: .github/scripts
        run: |
          python -m unittest discover -s .github/scripts -p 'test_ai_review.py' -v
          uvx ruff check .github/scripts/ai_review.py .github/scripts/test_ai_review.py

      - name: Commit reviewer fix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/scripts/ai_review.py
          git commit -m 'style(ai-review): satisfy Ruff security and modernization rules'
          git push origin HEAD:fix/ai-review-stability
