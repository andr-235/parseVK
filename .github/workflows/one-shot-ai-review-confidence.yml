name: One-shot AI reviewer confidence calibration

on:
  pull_request:
    branches:
      - main
    types: [synchronize]

permissions:
  contents: write

jobs:
  patch:
    if: >-
      github.event.pull_request.head.ref == 'fix/ai-review-confidence-calibration' &&
      github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout calibration branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: fix/ai-review-confidence-calibration
          fetch-depth: 0
          persist-credentials: true

      - name: Apply reviewer prompt patch
        run: python .github/scripts/patch_ai_review_confidence.py

      - name: Verify calibrated prompt
        run: |
          grep -F 'Прямое противоречие между изменённой реализацией' .github/scripts/ai_review.py
          grep -F 'confidence не ниже 0.95' .github/scripts/ai_review.py

      - name: Remove patch script and commit reviewer code
        run: |
          rm .github/scripts/patch_ai_review_confidence.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/scripts/ai_review.py
          git add -u .github/scripts/patch_ai_review_confidence.py
          git commit -m 'fix(ai-review): calibrate direct contract contradictions'
          git push origin HEAD:fix/ai-review-confidence-calibration
