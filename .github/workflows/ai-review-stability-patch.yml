name: One-shot AI reviewer stability patch

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize]

permissions:
  contents: write

jobs:
  patch:
    if: >-
      github.event.pull_request.head.ref == 'fix/ai-review-stability' &&
      github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout patch branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: fix/ai-review-stability
          fetch-depth: 0
          persist-credentials: true

      - name: Apply stability patch
        run: python .github/scripts/patch_ai_review_stability.py

      - name: Run reviewer unit tests
        env:
          PYTHONPATH: .github/scripts
        run: python -m unittest discover -s .github/scripts -p 'test_ai_review.py' -v

      - name: Validate patched workflow contract
        shell: bash
        run: |
          set -euo pipefail
          ! grep -q '\${{ runner.temp }}' .github/workflows/ai-code-review.yml
          grep -q 'prompt-\*.txt' .github/workflows/ai-code-review.yml
          grep -q -- '--events "$AI_REVIEW_DIR"' .github/workflows/ai-code-review.yml
          grep -q 'verdict="review-required"' .github/scripts/ai_review.py

      - name: Commit Python reviewer changes
        shell: bash
        run: |
          set -euo pipefail
          cp .github/workflows/ai-code-review.yml "$RUNNER_TEMP/ai-code-review.yml"
          git checkout -- .github/workflows/ai-code-review.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/scripts/ai_review.py .github/scripts/test_ai_review.py
          if ! git diff --cached --quiet; then
            git commit -m 'fix(ai-review): stabilize medium and oversized PR handling'
            git push origin HEAD:fix/ai-review-stability
          fi

      - name: Upload patched workflow
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: patched-ai-code-review
          path: ${{ runner.temp }}/ai-code-review.yml
          if-no-files-found: error
          retention-days: 1
