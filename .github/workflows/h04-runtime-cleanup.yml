name: H04 Runtime Cleanup

on:
  push:
    branches:
      - agent/p0-p2-vk-runtime-cleanup

permissions:
  contents: write

concurrency:
  group: h04-runtime-cleanup-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/p0-p2-vk-runtime-cleanup
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply H04 cleanup
        run: python .github/scripts/apply_h04_runtime_cleanup.py
      - name: Remove temporary patch machinery
        run: rm -f .github/scripts/apply_h04_runtime_cleanup.py .github/workflows/h04-runtime-cleanup.yml
      - name: Commit cleanup
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m "refactor(vk): remove legacy task fields from physical execution"
          git push origin HEAD:agent/p0-p2-vk-runtime-cleanup
