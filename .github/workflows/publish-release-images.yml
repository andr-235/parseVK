name: Publish Release Images

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/service-catalog.yaml
      - .github/scripts/latest_release.py
      - .github/scripts/test_latest_release.py
      - .github/scripts/release_manifest.py
      - .github/scripts/test_release_manifest.py
      - .github/workflows/ci.yml
      - .github/workflows/release.yml
      - .github/workflows/security.yml
      - .github/workflows/publish-release-images.yml
      - .github/workflows/release-deploy-coordinator.yml
      - .github/workflows/reusable-publish-image.yml
      - .releaserc.json
      - scripts/test-release-workflow.sh
      - scripts/test-release-handoff-workflow.sh
  workflow_dispatch:
    inputs:
      target_sha:
        description: Exact semantic-release commit SHA to publish
        required: true
        type: string
      coordinator_run_id:
        description: Release Deploy Coordinator run authorizing publication
        required: true
        type: string

permissions: {}

concurrency:
  group: publish-release-images-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || inputs.target_sha }}
  cancel-in-progress: true

jobs:
  contracts:
    name: Validate immutable release contracts
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v5
      - name: Run release workflow contracts
        run: bash scripts/test-release-workflow.sh
      - name: Run Ruff
        run: >-
          uvx ruff check
          .github/scripts/latest_release.py
          .github/scripts/test_latest_release.py
          .github/scripts/release_manifest.py
          .github/scripts/test_release_manifest.py

  gate:
    name: Verify release publication authorization
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
      statuses: write
    outputs:
      target_sha: ${{ steps.release.outputs.target_sha }}
      matrix: ${{ steps.matrix.outputs.value }}
    steps:
      - name: Checkout trusted release resolver
        uses: actions/checkout@v6
        with:
          ref: ${{ github.workflow_sha }}
          sparse-checkout: |
            .github/scripts/latest_release.py
          sparse-checkout-cone-mode: false
          persist-credentials: false
          path: trusted-release-resolver

      - name: Stage trusted release resolver
        shell: bash
        run: cp trusted-release-resolver/.github/scripts/latest_release.py "$RUNNER_TEMP/latest_release.py"

      - name: Checkout current main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Verify coordinator, release and gate statuses
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_SHA: ${{ inputs.target_sha }}
          COORDINATOR_RUN_ID: ${{ inputs.coordinator_run_id }}
        run: |
          set -euo pipefail

          MAIN_SHA="$(git rev-parse HEAD)"
          REMOTE_MAIN="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          [[ "$MAIN_SHA" == "$REMOTE_MAIN" ]] || {
            echo "::error::Publisher checked out stale main: checkout=$MAIN_SHA remote=$REMOTE_MAIN"
            exit 1
          }

          RELEASE_JSON="$(python3 "$RUNNER_TEMP/latest_release.py" --ref "$MAIN_SHA")"
          LATEST_RELEASE_SHA="$(jq -r '.release_sha' <<<"$RELEASE_JSON")"
          [[ "$TARGET_SHA" == "$LATEST_RELEASE_SHA" ]] || {
            echo "::error::Publisher target is stale: target=$TARGET_SHA latest=$LATEST_RELEASE_SHA"
            exit 1
          }

          COORDINATOR="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${COORDINATOR_RUN_ID}")"
          COORDINATOR_NAME="$(jq -r '.name' <<<"$COORDINATOR")"
          COORDINATOR_EVENT="$(jq -r '.event' <<<"$COORDINATOR")"
          COORDINATOR_BRANCH="$(jq -r '.head_branch // ""' <<<"$COORDINATOR")"
          COORDINATOR_STATUS="$(jq -r '.status' <<<"$COORDINATOR")"
          COORDINATOR_CONCLUSION="$(jq -r '.conclusion // ""' <<<"$COORDINATOR")"
          [[ "$COORDINATOR_NAME" == "Release Deploy Coordinator" ]] || {
            echo "::error::Run $COORDINATOR_RUN_ID is not Release Deploy Coordinator"
            exit 1
          }
          [[ "$COORDINATOR_EVENT" == "workflow_dispatch" || "$COORDINATOR_EVENT" == "workflow_run" ]] || {
            echo "::error::Unsupported coordinator event: $COORDINATOR_EVENT"
            exit 1
          }
          [[ "$COORDINATOR_BRANCH" == "main" ]] || {
            echo "::error::Coordinator did not run on main: $COORDINATOR_BRANCH"
            exit 1
          }
          if [[ "$COORDINATOR_STATUS" == "completed" && "$COORDINATOR_CONCLUSION" != "success" ]]; then
            echo "::error::Coordinator already failed: $COORDINATOR_CONCLUSION"
            exit 1
          fi

          STATUSES="$(gh api \
            "repos/${GITHUB_REPOSITORY}/commits/${TARGET_SHA}/statuses?per_page=100")"
          latest_status() {
            local context="$1" field="$2"
            jq -r --arg context "$context" --arg field "$field" '
              [.[] | select(.context == $context)]
              | sort_by(.created_at)
              | last
              | if . == null then "missing" else (.[$field] // "missing") end
            ' <<<"$STATUSES"
          }

          FULL_CI_STATE="$(latest_status release/full-ci state)"
          SECURITY_STATE="$(latest_status release/security state)"
          SECURITY_URL="$(latest_status release/security target_url)"
          [[ "$FULL_CI_STATE" == "success" ]] || {
            echo "::error::Full Release CI status is $FULL_CI_STATE for $TARGET_SHA"
            exit 1
          }
          [[ "$SECURITY_STATE" == "success" ]] || {
            echo "::error::Release Security status is $SECURITY_STATE for $TARGET_SHA"
            exit 1
          }

          SECURITY_RUN_ID="${SECURITY_URL##*/}"
          [[ "$SECURITY_RUN_ID" =~ ^[0-9]+$ ]] || {
            echo "::error::Security status has invalid target URL: $SECURITY_URL"
            exit 1
          }
          SECURITY_RUN="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${SECURITY_RUN_ID}")"
          [[ "$(jq -r '.name' <<<"$SECURITY_RUN")" == "Security Scanning" ]] || {
            echo "::error::Security status points to a different workflow"
            exit 1
          }
          [[ "$(jq -r '.event' <<<"$SECURITY_RUN")" == "workflow_dispatch" ]] || {
            echo "::error::Security status is not from an explicit release scan"
            exit 1
          }
          [[ "$(jq -r '.conclusion // ""' <<<"$SECURITY_RUN")" == "success" ]] || {
            echo "::error::Security status points to an unsuccessful run"
            exit 1
          }

          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/statuses/${TARGET_SHA}" \
            -f state=pending \
            -f context=release/immutable-ghcr \
            -f description="Immutable image publication is running" \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

          echo "target_sha=$TARGET_SHA" >> "$GITHUB_OUTPUT"
          echo "Publication authorized for release $TARGET_SHA by coordinator $COORDINATOR_RUN_ID"

      - name: Checkout validated release commit
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.release.outputs.target_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify semantic release commit
        shell: bash
        run: |
          set -euo pipefail
          RELEASE_SUBJECT="$(git log -1 --format=%s)"
          RELEASE_MESSAGE="$(git log -1 --format=%B)"
          [[ "$RELEASE_SUBJECT" == chore\(release\):* ]] || {
            echo "::error::Only semantic release commits may publish images: $RELEASE_SUBJECT"
            exit 1
          }
          printf '%s' "$RELEASE_MESSAGE" | grep -qF '[skip ci]' || {
            echo "::error::Semantic release commit is missing [skip ci]"
            exit 1
          }

      - name: Build complete image matrix
        id: matrix
        run: >-
          python3 .github/scripts/service_catalog.py matrix
          --purpose docker
          --all
          --github-output "$GITHUB_OUTPUT"

  publish-images:
    name: Publish immutable images
    needs: gate
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix: ${{ fromJSON(needs.gate.outputs.matrix) }}
    permissions:
      attestations: write
      contents: read
      id-token: write
      packages: write
    uses: ./.github/workflows/reusable-publish-image.yml
    with:
      service: ${{ matrix.service }}
      dockerfile: ${{ matrix.dockerfile }}
      image_repository: ghcr.io/${{ github.repository_owner }}/parsevk-${{ matrix.service }}
      target_sha: ${{ needs.gate.outputs.target_sha }}
      build_args: ${{ matrix.service == 'frontend' && 'VITE_APP_TITLE=Центр аналитики\nVITE_API_URL=/api\nVITE_API_WS_URL=auto\nVITE_DEV_MODE=false' || '' }}

  manifest:
    name: Build release manifest
    needs:
      - gate
      - publish-images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      statuses: write
    steps:
      - name: Checkout trusted release resolver
        uses: actions/checkout@v6
        with:
          ref: ${{ github.workflow_sha }}
          sparse-checkout: |
            .github/scripts/latest_release.py
          sparse-checkout-cone-mode: false
          persist-credentials: false
          path: trusted-release-resolver

      - name: Stage trusted release resolver
        shell: bash
        run: cp trusted-release-resolver/.github/scripts/latest_release.py "$RUNNER_TEMP/latest_release.py"

      - name: Checkout validated release commit
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.gate.outputs.target_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Recheck latest release before manifest
        shell: bash
        env:
          TARGET_SHA: ${{ needs.gate.outputs.target_sha }}
        run: |
          set -euo pipefail
          MAIN_SHA="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          git fetch --no-tags origin "$MAIN_SHA"
          RELEASE_JSON="$(python3 "$RUNNER_TEMP/latest_release.py" --ref "$MAIN_SHA")"
          LATEST_RELEASE_SHA="$(jq -r '.release_sha' <<<"$RELEASE_JSON")"
          [[ "$LATEST_RELEASE_SHA" == "$TARGET_SHA" ]] || {
            echo "::error::Refusing stale manifest: target=$TARGET_SHA latest=$LATEST_RELEASE_SHA"
            exit 1
          }

      - name: Download image metadata
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: published-image-*-${{ needs.gate.outputs.target_sha }}
          path: release-image-metadata
          merge-multiple: true

      - name: Build and validate release manifest
        shell: bash
        env:
          TARGET_SHA: ${{ needs.gate.outputs.target_sha }}
        run: |
          set -euo pipefail
          python3 .github/scripts/release_manifest.py \
            --catalog .github/service-catalog.yaml \
            --metadata-dir release-image-metadata \
            --repository "$GITHUB_REPOSITORY" \
            --commit-sha "$TARGET_SHA" \
            --output-dir release-manifest

      - name: Upload immutable release manifest
        uses: actions/upload-artifact@v7.0.1
        with:
          name: release-manifest-${{ needs.gate.outputs.target_sha }}
          path: release-manifest/
          if-no-files-found: error
          retention-days: 90

      - name: Mark immutable release published
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_SHA: ${{ needs.gate.outputs.target_sha }}
        run: |
          set -euo pipefail
          IMAGE_COUNT="$(find release-image-metadata -name '*.json' | wc -l | tr -d ' ')"
          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/statuses/${TARGET_SHA}" \
            -f state=success \
            -f context=release/immutable-ghcr \
            -f description="${IMAGE_COUNT} immutable images and manifest published" \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

      - name: Write workflow summary
        shell: bash
        run: |
          {
            echo "## Immutable release"
            echo
            echo "- Commit: \`${{ needs.gate.outputs.target_sha }}\`"
            echo "- Images: \`$(find release-image-metadata -name '*.json' | wc -l)\`"
            echo "- Artifact: \`release-manifest-${{ needs.gate.outputs.target_sha }}\`"
            echo "- Status: \`release/immutable-ghcr\`"
          } >> "$GITHUB_STEP_SUMMARY"

  publication-status:
    name: Finalize immutable release status
    needs:
      - gate
      - publish-images
      - manifest
    if: always() && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      statuses: write
    steps:
      - name: Record terminal publication status
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_SHA: ${{ needs.gate.outputs.target_sha || inputs.target_sha }}
          GATE_RESULT: ${{ needs.gate.result }}
          PUBLISH_RESULT: ${{ needs.publish-images.result }}
          MANIFEST_RESULT: ${{ needs.manifest.result }}
        run: |
          set -euo pipefail

          [[ "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]] || {
            echo "::error::Cannot finalize immutable status for invalid SHA: $TARGET_SHA"
            exit 1
          }

          state=success
          description="Immutable images and manifest published"
          if [[ "$GATE_RESULT" != "success" || "$PUBLISH_RESULT" != "success" || "$MANIFEST_RESULT" != "success" ]]; then
            state=failure
            description="Immutable release publication failed"
          fi

          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/statuses/${TARGET_SHA}" \
            -f state="$state" \
            -f context=release/immutable-ghcr \
            -f description="$description" \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

          [[ "$state" == "success" ]] || exit 1
