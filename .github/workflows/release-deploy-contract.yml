name: Release Deploy Contract

on:
  pull_request:
    branches: [main]
    paths:
      - .github/scripts/latest_release.py
      - .github/scripts/test_latest_release.py
      - .github/scripts/cancel-superseded-deploys.sh
      - .github/workflows/ci.yml
      - .github/workflows/security.yml
      - .github/workflows/deploy.yml
      - .github/workflows/deploy-queue-cleanup.yml
      - .github/workflows/release-deploy-coordinator.yml
      - .github/workflows/publish-release-images.yml
      - .github/workflows/reusable-publish-image.yml
      - .github/workflows/release-deploy-contract.yml
      - scripts/test-cancel-superseded-deploys.sh
      - scripts/test-release-coordinator-supersession.sh
      - scripts/test-release-handoff-workflow.sh
  push:
    branches: [main]
    paths:
      - .github/scripts/latest_release.py
      - .github/scripts/test_latest_release.py
      - .github/scripts/cancel-superseded-deploys.sh
      - .github/workflows/ci.yml
      - .github/workflows/security.yml
      - .github/workflows/deploy.yml
      - .github/workflows/deploy-queue-cleanup.yml
      - .github/workflows/release-deploy-coordinator.yml
      - .github/workflows/publish-release-images.yml
      - .github/workflows/reusable-publish-image.yml
      - .github/workflows/release-deploy-contract.yml
      - scripts/test-cancel-superseded-deploys.sh
      - scripts/test-release-coordinator-supersession.sh
      - scripts/test-release-handoff-workflow.sh

permissions:
  contents: read

jobs:
  contract:
    name: Validate Latest Release Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout complete release history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Run resolver tests
        env:
          PYTHONPATH: .github/scripts
        run: >-
          python3 -m unittest discover
          -s .github/scripts
          -p 'test_latest_release.py'
          -v

      - name: Validate release handoff and queue cleanup
        run: |
          bash scripts/test-release-handoff-workflow.sh
          bash scripts/test-cancel-superseded-deploys.sh
          bash scripts/test-release-coordinator-supersession.sh

      - name: Compile release resolver
        run: python3 -m py_compile .github/scripts/latest_release.py .github/scripts/test_latest_release.py
