name: P2 Hardening Branch CI

on:
  push:
    branches:
      - agent/p2-hardening-source-level-collections

concurrency:
  group: p2-hardening-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v5
      - name: Apply exact Ruff import fixes
        run: |
          set -euo pipefail
          uvx ruff check --fix \
            services/tasks-service/tests/test_outbox_publisher_configuration.py \
            services/tasks-service/tests/test_outbox_publisher_delivery.py \
            services/tasks-service/tests/test_outbox_repository.py \
            services/tasks-service/tests/test_vk_cancel_command_publisher.py \
            services/vk-service/tests/integration/repositories/test_canonical_cancelled_audit.py \
            services/vk-service/tests/integration/repositories/test_canonical_source_attachment.py \
            services/vk-service/tests/integration/repositories/test_canonical_source_lifecycle.py \
            services/vk-service/tests/integration/repositories/test_execution_repository.py \
            services/vk-service/tests/test_execution_control.py \
            services/vk-service/tests/test_execution_runner_postgres.py
          if git diff --quiet; then
            echo "Ruff imports already canonical"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            services/tasks-service/tests/test_outbox_publisher_configuration.py \
            services/tasks-service/tests/test_outbox_publisher_delivery.py \
            services/tasks-service/tests/test_outbox_repository.py \
            services/tasks-service/tests/test_vk_cancel_command_publisher.py \
            services/vk-service/tests/integration/repositories/test_canonical_cancelled_audit.py \
            services/vk-service/tests/integration/repositories/test_canonical_source_attachment.py \
            services/vk-service/tests/integration/repositories/test_canonical_source_lifecycle.py \
            services/vk-service/tests/integration/repositories/test_execution_repository.py \
            services/vk-service/tests/test_execution_control.py \
            services/vk-service/tests/test_execution_runner_postgres.py
          git commit -m "style: apply Ruff import ordering"
          git push origin HEAD:agent/p2-hardening-source-level-collections

  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - working-directory: libs/py/contracts
        run: |
          uv sync --group dev --frozen
          uv run pytest -v
          uv run mypy parsevk_contracts
          uv run python -m parsevk_contracts.generation.cli validate-registry
          uv run python -m parsevk_contracts.generation.cli check
          npx --yes @asyncapi/cli@6.0.2 validate generated/asyncapi/parsevk-contracts.yaml

  tasks-service:
    uses: ./.github/workflows/reusable-python-quality.yml
    with:
      service: tasks-service

  vk-service:
    uses: ./.github/workflows/reusable-python-quality.yml
    with:
      service: vk-service

  vk-migrations:
    uses: ./.github/workflows/reusable-alembic-migration.yml
    with:
      service: vk-service
      database_url_env: VK_SERVICE_DATABASE_URL
