name: Run AI review UX patch

on:
  pull_request:
    branches:
      - main
    types: [synchronize]
    paths:
      - .github/workflows/run-patch-ai-review-ux.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: test/ai-review-e2e
          fetch-depth: 0

      - name: Apply patch
        shell: bash
        run: |
          set -euo pipefail
          python .github/scripts/patch_ai_review_ux.py
          rm -f \
            .github/scripts/patch_ai_review_ux.py \
            .github/workflows/patch-ai-review-ux.yml \
            .github/workflows/run-patch-ai-review-ux.yml

      - name: Commit patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A .github
          git commit -m "fix: finalize AI review comments and reactions"
          git push origin HEAD:test/ai-review-e2e
