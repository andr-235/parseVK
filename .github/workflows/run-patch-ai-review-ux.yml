name: Run AI review UX patch

on:
  pull_request:
    branches:
      - main
    types: [synchronize]
    paths:
      - .github/workflows/run-patch-ai-review-ux.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: test/ai-review-e2e
          fetch-depth: 0

      - name: Extract and run patch
        shell: bash
        run: |
          set -euo pipefail
          awk '
            /python - <<'\''PY'\''/ { capture=1; next }
            capture && /^          PY$/ { exit }
            capture { sub(/^          /, ""); print }
          ' .github/workflows/patch-ai-review-ux.yml >"${RUNNER_TEMP}/patch_ai_review_ux.py"
          python "${RUNNER_TEMP}/patch_ai_review_ux.py"
          rm -f .github/workflows/run-patch-ai-review-ux.yml

      - name: Commit patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/ai-code-review.yml \
            .github/workflows/patch-ai-review-ux.yml \
            .github/workflows/run-patch-ai-review-ux.yml
          git commit -m "fix: finalize AI review comments and reactions"
          git push origin HEAD:test/ai-review-e2e
