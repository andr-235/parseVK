name: Export AI review UX patch

on:
  pull_request:
    branches:
      - main
    types: [synchronize]
    paths:
      - .github/workflows/run-patch-ai-review-ux.yml

permissions:
  contents: read

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: test/ai-review-e2e

      - name: Apply patch
        shell: bash
        run: |
          set -euo pipefail
          python .github/scripts/patch_ai_review_ux.py

      - name: Upload patched workflow
        uses: actions/upload-artifact@v4
        with:
          name: patched-ai-code-review
          path: .github/workflows/ai-code-review.yml
          if-no-files-found: error
          retention-days: 1
