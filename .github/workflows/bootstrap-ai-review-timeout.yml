name: Bootstrap AI Review Timeout

on:
  push:
    branches:
      - fix/ai-review-provider-timeout
    paths:
      - .github/workflows/bootstrap-ai-review-timeout.yml

permissions:
  contents: write

jobs:
  patch:
    name: Patch Trusted Reviewer
    if: >-
      github.repository == 'andr-235/parseVK' &&
      github.actor == 'andr-235'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout hotfix branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/ai-review-provider-timeout
          fetch-depth: 0

      - name: Patch provider timeout and remove bootstrap
        run: |
          python3 - <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/ai-code-review.yml')
          text = workflow.read_text(encoding='utf-8')
          marker = '{"default_agent":"plan",'
          replacement = '{"provider":{"opencode":{"options":{"timeout":900000}}},"default_agent":"plan",'
          if text.count(marker) != 1:
              raise SystemExit(f'expected one inline OpenCode config marker, found {text.count(marker)}')
          workflow.write_text(text.replace(marker, replacement, 1), encoding='utf-8')
          Path('.github/workflows/bootstrap-ai-review-timeout.yml').unlink()
          PY

      - name: Commit deterministic hotfix
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/ai-code-review.yml .github/workflows/bootstrap-ai-review-timeout.yml
          git diff --cached --check
          git commit -m 'fix(ai-review): extend provider request timeout'
          git push origin HEAD:fix/ai-review-provider-timeout
