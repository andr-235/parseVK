name: Apply Release Gate Checkout Fix

on:
  push:
    branches:
      - fix/release-gate-checkout-isolation

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/release-gate-checkout-isolation
          fetch-depth: 0

      - name: Apply isolated checkout and release rules
        run: python3 .github/scripts/apply_release_gate_fix.py

      - name: Validate repaired release contracts
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/test-release-workflow.sh
          python3 -m json.tool .releaserc.json >/dev/null

      - name: Commit repaired files and remove bootstrap files
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/apply-release-gate-fix.yml
          rm .github/scripts/apply_release_gate_fix.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "chore(ci): isolate release resolver checkouts"
          git push origin HEAD:fix/release-gate-checkout-isolation
