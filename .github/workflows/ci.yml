name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      frontend_changed: ${{ steps.filter.outputs.frontend_changed }}
      python_changed: ${{ steps.filter.outputs.python_changed }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Detect changed paths
        id: filter
        shell: bash
        run: |
          set -euo pipefail

          EVENT_NAME="${{ github.event_name }}"
          if [ "$EVENT_NAME" = "pull_request" ]; then
            BASE_SHA="${{ github.event.pull_request.base.sha }}"
            HEAD_SHA="${{ github.sha }}"
          else
            BASE_SHA="${{ github.event.before }}"
            HEAD_SHA="${{ github.sha }}"
          fi

          FRONTEND_CHANGED=false
          PYTHON_CHANGED=false
          CONTRACTS_CHANGED=false

          if [ -z "$BASE_SHA" ] || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            echo "Base commit not found; treating as full change set"
            FRONTEND_CHANGED=true
            PYTHON_CHANGED=true
            CONTRACTS_CHANGED=true
          else
            CHANGED_FILES=$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")
            if [ -z "$CHANGED_FILES" ]; then
              echo "No changed files detected"
            else
              echo "Changed files:"
              echo "$CHANGED_FILES"
            fi

            if echo "$CHANGED_FILES" | grep -qE '^front/'; then
              FRONTEND_CHANGED=true
            fi

            if echo "$CHANGED_FILES" | grep -qE '^(services/|libs/py/common/|pyproject\.toml)'; then
              PYTHON_CHANGED=true
            fi

            if echo "$CHANGED_FILES" | grep -qE '^libs/py/contracts/'; then
              CONTRACTS_CHANGED=true
              PYTHON_CHANGED=true
            fi

            if echo "$CHANGED_FILES" | grep -qE '^(\.github/workflows/ci\.yml|\.github/scripts/validate_contract_examples\.py)$'; then
              CONTRACTS_CHANGED=true
              PYTHON_CHANGED=true
            fi
          fi

          echo "frontend_changed=$FRONTEND_CHANGED" >> "$GITHUB_OUTPUT"
          echo "python_changed=$PYTHON_CHANGED" >> "$GITHUB_OUTPUT"

  lint:
    name: Lint Frontend
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.frontend_changed == 'true'
    steps:
      - uses: actions/checkout@v6
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        working-directory: front
        run: bun install --frozen-lockfile
      - name: Run linter
        working-directory: front
        run: bun run lint

  typecheck:
    name: Typecheck Frontend
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.frontend_changed == 'true'
    steps:
      - uses: actions/checkout@v6
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        working-directory: front
        run: bun install --frozen-lockfile
      - name: Run typecheck
        working-directory: front
        run: bun run build

  ruff:
    name: Ruff lint
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.python_changed == 'true'
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Run ruff check on all Python sources
        run: uvx ruff check --output-format=github services/ libs/ .github/scripts/

  alembic-graphs:
    name: Validate Alembic graphs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Validate Alembic revision graphs
        run: python3 .github/scripts/validate_alembic_graphs.py

  production-validation:
    name: Validate Production Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Validate deploy workflow contracts
        run: bash scripts/test-deploy-workflow.sh
      - name: Validate production shell syntax
        run: |
          set -euo pipefail
          while IFS= read -r -d '' script; do
            bash -n "$script"
          done < <(find .github/scripts/production -type f -name '*.sh' -print0)
          bash -n .github/scripts/health-check.sh
          bash -n .github/scripts/http-health-check.sh
      - name: Validate Docker Compose configuration
        run: docker compose -f docker-compose.yml config --quiet

  frontend-tests:
    name: Test Frontend
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.frontend_changed == 'true'
    steps:
      - uses: actions/checkout@v6
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        working-directory: front
        run: bun install --frozen-lockfile
      - name: Run tests
        working-directory: front
        run: bun run test

  pytest-libs:
    name: Test common lib
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.python_changed == 'true'
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install dependencies
        working-directory: libs/py/common
        run: uv sync --group dev
      - name: Run tests
        working-directory: libs/py/common
        run: uv run pytest -v

  pytest-services:
    name: Test ${{ matrix.service }}
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.python_changed == 'true'
    strategy:
      fail-fast: false
      matrix:
        service:
          - api-gateway
          - identity-service
          - tasks-service
          - vk-service
          - content-service
          - telegram-service
          - listings-service
          - moderation-service
          - im-service
    env:
      PYTHONPATH: ${{ github.workspace }}/libs/py/common
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install dependencies
        working-directory: services/${{ matrix.service }}
        run: uv sync --group test
      - name: Run tests
        working-directory: services/${{ matrix.service }}
        run: uv run pytest -v

  release-gate:
    name: Release Gate
    runs-on: ubuntu-latest
    if: always()
    needs:
      - changes
      - lint
      - typecheck
      - ruff
      - alembic-graphs
      - production-validation
      - frontend-tests
      - pytest-libs
      - pytest-services
    steps:
      - name: Enforce required checks
        shell: bash
        env:
          FRONTEND_CHANGED: ${{ needs.changes.outputs.frontend_changed }}
          PYTHON_CHANGED: ${{ needs.changes.outputs.python_changed }}
          CHANGES_RESULT: ${{ needs.changes.result }}
          LINT_RESULT: ${{ needs.lint.result }}
          TYPECHECK_RESULT: ${{ needs.typecheck.result }}
          RUFF_RESULT: ${{ needs.ruff.result }}
          ALEMBIC_RESULT: ${{ needs.alembic-graphs.result }}
          PRODUCTION_RESULT: ${{ needs.production-validation.result }}
          FRONTEND_TESTS_RESULT: ${{ needs.frontend-tests.result }}
          PYTEST_LIBS_RESULT: ${{ needs.pytest-libs.result }}
          PYTEST_SERVICES_RESULT: ${{ needs.pytest-services.result }}
        run: |
          set -euo pipefail
          failures=0

          require_success() {
            local name="$1"
            local result="$2"
            if [ "$result" != "success" ]; then
              echo "::error::${name} завершён со статусом ${result}"
              failures=$((failures + 1))
            fi
          }

          require_conditional() {
            local name="$1"
            local expected="$2"
            local result="$3"
            case "$expected" in
              true)
                require_success "$name" "$result"
                ;;
              false)
                if [ "$result" != "success" ] && [ "$result" != "skipped" ]; then
                  echo "::error::${name} завершён со статусом ${result}"
                  failures=$((failures + 1))
                fi
                ;;
              *)
                echo "::error::Некорректный output change detector для ${name}: '${expected}'"
                failures=$((failures + 1))
                ;;
            esac
          }

          require_success "Detect changes" "$CHANGES_RESULT"
          require_success "Validate Alembic graphs" "$ALEMBIC_RESULT"
          require_success "Validate Production Release" "$PRODUCTION_RESULT"

          require_conditional "Lint Frontend" "$FRONTEND_CHANGED" "$LINT_RESULT"
          require_conditional "Typecheck Frontend" "$FRONTEND_CHANGED" "$TYPECHECK_RESULT"
          require_conditional "Test Frontend" "$FRONTEND_CHANGED" "$FRONTEND_TESTS_RESULT"

          require_conditional "Ruff lint" "$PYTHON_CHANGED" "$RUFF_RESULT"
          require_conditional "Test common lib" "$PYTHON_CHANGED" "$PYTEST_LIBS_RESULT"
          require_conditional "Test Python services" "$PYTHON_CHANGED" "$PYTEST_SERVICES_RESULT"

          if (( failures > 0 )); then
            echo "::error::Release Gate заблокирован: ${failures} обязательных проверок не пройдены."
            exit 1
          fi

          echo "Release Gate пройден для commit ${{ github.sha }}"
