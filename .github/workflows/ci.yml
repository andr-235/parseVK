name: Full Release CI

on:
  workflow_dispatch:
    inputs:
      target_sha:
        description: Exact semantic-release commit SHA to validate
        required: true
        type: string
      base_sha:
        description: Already validated source commit SHA
        required: true
        type: string
      full_validation:
        description: Must be true for production release validation
        required: true
        default: true
        type: boolean

permissions:
  contents: read
  statuses: write

concurrency:
  group: full-release-ci-${{ inputs.target_sha }}
  cancel-in-progress: true

jobs:
  prepare:
    name: Prepare Full Release Validation
    runs-on: ubuntu-latest
    outputs:
      service_matrix: ${{ steps.services.outputs.value }}
      migration_matrix: ${{ steps.migrations.outputs.value }}
    steps:
      - name: Mark Full Release CI pending
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_SHA: ${{ inputs.target_sha }}
        run: |
          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/statuses/${TARGET_SHA}" \
            -f state=pending \
            -f context=release/full-ci \
            -f description="Full Release CI is running" \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

      - name: Checkout trusted release resolver
        uses: actions/checkout@v7
        with:
          ref: ${{ github.workflow_sha }}
          sparse-checkout: |
            .github/scripts/latest_release.py
          sparse-checkout-cone-mode: false
          persist-credentials: false
          path: trusted-release-resolver

      - name: Stage trusted release resolver
        shell: bash
        run: cp trusted-release-resolver/.github/scripts/latest_release.py "$RUNNER_TEMP/latest_release.py"

      - name: Checkout validated release commit
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.target_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact release target
        shell: bash
        env:
          TARGET_SHA: ${{ inputs.target_sha }}
          BASE_SHA: ${{ inputs.base_sha }}
          FULL_VALIDATION: ${{ inputs.full_validation }}
        run: |
          set -euo pipefail
          ACTUAL_SHA="$(git rev-parse HEAD)"
          CURRENT_MAIN="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          [[ "$FULL_VALIDATION" == "true" ]] || {
            echo "::error::Production release requires full_validation=true"
            exit 1
          }
          [[ "$ACTUAL_SHA" == "$TARGET_SHA" ]] || {
            echo "::error::Full Release CI checked out $ACTUAL_SHA, expected $TARGET_SHA"
            exit 1
          }

          git fetch --no-tags origin "$CURRENT_MAIN"
          RELEASE_JSON="$(python3 "$RUNNER_TEMP/latest_release.py" --ref "$CURRENT_MAIN")"
          LATEST_RELEASE_SHA="$(jq -r '.release_sha' <<<"$RELEASE_JSON")"
          [[ "$LATEST_RELEASE_SHA" == "$TARGET_SHA" ]] || {
            echo "::error::Release target is stale: target=$TARGET_SHA latest_release=$LATEST_RELEASE_SHA main=$CURRENT_MAIN"
            exit 1
          }

          RELEASE_SUBJECT="$(git log -1 --format=%s "$TARGET_SHA")"
          RELEASE_MESSAGE="$(git log -1 --format=%B "$TARGET_SHA")"
          RELEASE_PARENT="$(git rev-parse "${TARGET_SHA}^1")"
          [[ "$RELEASE_SUBJECT" == chore\(release\):* ]] || {
            echo "::error::Full Release CI accepts only semantic-release commits: $RELEASE_SUBJECT"
            exit 1
          }
          printf '%s' "$RELEASE_MESSAGE" | grep -qF '[skip ci]' || {
            echo "::error::Semantic-release commit is missing [skip ci]"
            exit 1
          }
          [[ "$RELEASE_PARENT" == "$BASE_SHA" ]] || {
            echo "::error::Release parent mismatch: parent=$RELEASE_PARENT validated_source=$BASE_SHA"
            exit 1
          }
          git cat-file -e "${BASE_SHA}^{commit}" || {
            echo "::error::Validated source commit is unavailable: $BASE_SHA"
            exit 1
          }

      - name: Build complete Python service matrix
        id: services
        run: >-
          python3 .github/scripts/service_catalog.py matrix
          --purpose pytest
          --all
          --github-output "$GITHUB_OUTPUT"

      - name: Build complete migration matrix
        id: migrations
        run: >-
          python3 .github/scripts/service_catalog.py matrix
          --purpose migration
          --all
          --github-output "$GITHUB_OUTPUT"

  repository:
    name: Validate Repository And Release Contracts
    runs-on: ubuntu-latest
    needs: prepare
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.target_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Validate service catalog and Alembic graphs
        run: |
          python3 .github/scripts/test_service_catalog.py -v
          python3 .github/scripts/test_validate_alembic_graphs.py -v
          python3 .github/scripts/service_catalog.py validate --compose-file docker-compose.yml
          python3 .github/scripts/validate_alembic_graphs.py

      - name: Validate deploy and release contracts
        run: |
          bash scripts/test-deploy-workflow.sh
          bash scripts/test-release-workflow.sh

      - name: Validate production shell and Compose configuration
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' script; do
            bash -n "$script"
          done < <(find .github/scripts/production -type f -name '*.sh' -print0)
          bash -n .github/scripts/health-check.sh
          bash -n .github/scripts/http-health-check.sh
          docker compose -f docker-compose.yml config --quiet

      - name: Ruff changed Python files
        shell: bash
        env:
          BASE_SHA: ${{ inputs.base_sha }}
          TARGET_SHA: ${{ inputs.target_sha }}
        run: |
          set -euo pipefail
          mapfile -t PYTHON_FILES < <(
            git diff --name-only --diff-filter=ACMRT "$BASE_SHA...$TARGET_SHA" -- '*.py' |
              while IFS= read -r path; do
                [[ -f "$path" ]] && printf '%s\n' "$path"
              done
          )
          if (( ${#PYTHON_FILES[@]} == 0 )); then
            echo "No changed Python files to lint."
            exit 0
          fi
          printf 'Ruff files:\n'
          printf '  %s\n' "${PYTHON_FILES[@]}"
          uvx ruff check --output-format=github "${PYTHON_FILES[@]}"

  frontend:
    name: Validate Frontend
    runs-on: ubuntu-latest
    needs: prepare
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.target_sha }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        working-directory: front
        run: bun install --frozen-lockfile
      - name: Lint
        working-directory: front
        run: bun run lint
      - name: Typecheck and build
        working-directory: front
        run: bun run build
      - name: Test
        working-directory: front
        run: bun run test

  common:
    name: Test Common Library
    runs-on: ubuntu-latest
    needs: prepare
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.target_sha }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install dependencies
        working-directory: libs/py/common
        run: uv sync --group dev --frozen
      - name: Test
        working-directory: libs/py/common
        run: uv run pytest -v

  services:
    name: Test All Python Services
    needs: prepare
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        service: ${{ fromJSON(needs.prepare.outputs.service_matrix) }}
    uses: ./.github/workflows/reusable-python-quality.yml
    with:
      service: ${{ matrix.service }}

  migrations:
    name: Test All Database Migrations
    needs: prepare
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix: ${{ fromJSON(needs.prepare.outputs.migration_matrix) }}
    uses: ./.github/workflows/reusable-alembic-migration.yml
    with:
      service: ${{ matrix.service }}
      database_url_env: ${{ matrix.database_url_env }}

  contracts:
    name: Validate Contracts
    runs-on: ubuntu-latest
    needs: prepare
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.target_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install dependencies
        working-directory: libs/py/contracts
        run: uv sync --group dev --frozen

      - name: Test, typecheck and validate generated artifacts
        working-directory: libs/py/contracts
        run: |
          uv run pytest -v
          uv run mypy parsevk_contracts
          uv run python -m parsevk_contracts.generation.cli validate-registry
          uv run python -m parsevk_contracts.generation.cli validate-policy
          uv run python -m parsevk_contracts.generation.cli check

      - name: Check semantic contract evolution
        shell: bash
        env:
          BASE_SHA: ${{ inputs.base_sha }}
        run: |
          set -euo pipefail
          BASELINE_DIR="${RUNNER_TEMP}/contracts-baseline"
          mkdir -p "$BASELINE_DIR"
          git archive "$BASE_SHA" libs/py/contracts/generated |
            tar -x -C "$BASELINE_DIR"
          cd libs/py/contracts
          uv run python -m parsevk_contracts.generation.cli check-evolution \
            --baseline "$BASELINE_DIR/libs/py/contracts/generated" \
            --current generated
          uv run python "${GITHUB_WORKSPACE}/.github/scripts/validate_contract_examples.py"
          uv build
          unzip -l dist/*.whl | grep 'parsevk_contracts/py.typed'

      - name: Validate AsyncAPI
        working-directory: libs/py/contracts
        run: |
          uv run python -c "from parsevk_contracts.generation import generate_all; from parsevk_contracts.vk.commands import CATALOG; generate_all(CATALOG)"
          bash "${GITHUB_WORKSPACE}/.github/scripts/validate-asyncapi.sh" \
            generated/asyncapi/parsevk-contracts.yaml

  release-gate:
    name: Full Release Gate
    runs-on: ubuntu-latest
    if: always()
    needs:
      - prepare
      - repository
      - frontend
      - common
      - services
      - migrations
      - contracts
    steps:
      - name: Enforce full release validation
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_SHA: ${{ inputs.target_sha }}
          PREPARE_RESULT: ${{ needs.prepare.result }}
          REPOSITORY_RESULT: ${{ needs.repository.result }}
          FRONTEND_RESULT: ${{ needs.frontend.result }}
          COMMON_RESULT: ${{ needs.common.result }}
          SERVICES_RESULT: ${{ needs.services.result }}
          MIGRATIONS_RESULT: ${{ needs.migrations.result }}
          CONTRACTS_RESULT: ${{ needs.contracts.result }}
        run: |
          set -euo pipefail
          failures=0
          require_success() {
            local name="$1"
            local result="$2"
            if [[ "$result" != "success" ]]; then
              echo "::error::${name} completed with ${result}"
              failures=$((failures + 1))
            fi
          }
          require_success "Prepare Full Release Validation" "$PREPARE_RESULT"
          require_success "Repository And Release Contracts" "$REPOSITORY_RESULT"
          require_success "Frontend" "$FRONTEND_RESULT"
          require_success "Common Library" "$COMMON_RESULT"
          require_success "Python Services" "$SERVICES_RESULT"
          require_success "Database Migrations" "$MIGRATIONS_RESULT"
          require_success "Contracts" "$CONTRACTS_RESULT"

          status_state=success
          status_description="Full Release CI passed"
          if (( failures > 0 )); then
            status_state=failure
            status_description="Full Release CI failed (${failures} groups)"
          fi

          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/statuses/${TARGET_SHA}" \
            -f state="$status_state" \
            -f context=release/full-ci \
            -f description="$status_description" \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

          if (( failures > 0 )); then
            echo "::error::Full Release Gate blocked by ${failures} failed validation groups"
            exit 1
          fi
          echo "Full Release Gate passed for $TARGET_SHA"
