name: Validate Workflow Contexts

on:
  pull_request:
    paths:
      - ".github/workflows/**"
      - ".github/scripts/validate_workflow_contexts.py"
      - ".github/scripts/validate_security_workflow.py"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/**"
      - ".github/scripts/validate_workflow_contexts.py"
      - ".github/scripts/validate_security_workflow.py"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: python3 .github/scripts/validate_workflow_contexts.py
      - run: python3 .github/scripts/validate_security_workflow.py
