name: AI Review Inline Publisher

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/scripts/ai_review_inline.py
      - .github/scripts/ai_review_ui/**
      - .github/scripts/test_ai_review_inline*.py
      - .github/workflows/ai-review-inline-publisher.yml
  workflow_run:
    workflows:
      - AI Code Review
    types:
      - completed

permissions: {}

jobs:
  test:
    name: Test inline publisher
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Pull Request
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5

      - name: Run unit tests
        env:
          PYTHONPATH: .github/scripts
        run: >-
          python -m unittest discover
          -s .github/scripts
          -p 'test_ai_review_inline*.py'
          -v

      - name: Run Ruff
        run: >-
          uvx ruff check
          .github/scripts/ai_review_inline.py
          .github/scripts/ai_review_ui
          .github/scripts/test_ai_review_inline*.py

  publish:
    name: Publish inline review
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.pull_requests[0].number != null
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      issues: write
      pull-requests: write
    steps:
      - name: Checkout trusted publisher
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout: |
            .github/scripts/ai_review_inline.py
            .github/scripts/ai_review_ui
          sparse-checkout-cone-mode: false

      - name: Check validated AI review artifact
        id: artifact
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
          ARTIFACT_NAME: ai-review-result-${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail

          response_file="$RUNNER_TEMP/ai-review-artifacts.json"
          curl --fail --silent --show-error \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN_ID}/artifacts?per_page=100" \
            > "$response_file"

          python - "$response_file" "$ARTIFACT_NAME" "$GITHUB_OUTPUT" <<'PY'
          import json
          import sys
          from pathlib import Path

          response_path, expected_name, output_path = sys.argv[1:]
          payload = json.loads(Path(response_path).read_text(encoding="utf-8"))
          artifacts = payload.get("artifacts", [])
          exists = any(
              artifact.get("name") == expected_name and not artifact.get("expired", False)
              for artifact in artifacts
          )
          with Path(output_path).open("a", encoding="utf-8") as output:
              output.write(f"exists={'true' if exists else 'false'}\n")
          print(
              f"Artifact {expected_name!r} "
              + ("is available." if exists else "was not produced by the source run.")
          )
          PY

      - name: Download validated AI review result
        id: download
        if: steps.artifact.outputs.exists == 'true'
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ai-review-result-${{ github.event.workflow_run.id }}
          path: ${{ github.workspace }}/.ai-review-runtime
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Publish GitHub Pull Request review
        if: steps.download.outcome == 'success'
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
          PYTHONPATH: .github/scripts
        run: >-
          python .github/scripts/ai_review_inline.py
          --pr "$PR_NUMBER"
          --result .ai-review-runtime/review-result.json

      - name: Skip inline publishing without an artifact
        if: steps.artifact.outputs.exists != 'true'
        run: echo 'Source AI review run produced no validated artifact; inline publishing is not required.'

      - name: Report artifact download failure
        if: >-
          steps.artifact.outputs.exists == 'true' &&
          steps.download.outcome != 'success'
        run: echo 'Validated artifact exists but could not be downloaded; legacy publisher remains authoritative.'
