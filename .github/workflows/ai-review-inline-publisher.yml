name: AI Review Inline Publisher

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/scripts/ai_review_inline.py
      - .github/scripts/ai_review_ui/**
      - .github/scripts/test_ai_review_inline.py
      - .github/workflows/ai-review-inline-publisher.yml
  workflow_run:
    workflows:
      - AI Code Review
    types:
      - completed

permissions: {}

jobs:
  test:
    name: Test inline publisher
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Pull Request
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5

      - name: Run unit tests
        env:
          PYTHONPATH: .github/scripts
        run: >-
          python -m unittest discover
          -s .github/scripts
          -p 'test_ai_review_inline.py'
          -v

      - name: Run Ruff
        run: >-
          uvx ruff check
          .github/scripts/ai_review_inline.py
          .github/scripts/ai_review_ui
          .github/scripts/test_ai_review_inline.py

  publish:
    name: Publish inline review
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.pull_requests[0].number != null
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      issues: write
      pull-requests: write
    steps:
      - name: Checkout trusted publisher
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout: |
            .github/scripts/ai_review_inline.py
            .github/scripts/ai_review_ui
          sparse-checkout-cone-mode: false

      - name: Download validated AI review result
        id: download
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ai-review-result-${{ github.event.workflow_run.id }}
          path: ${{ github.workspace }}/.ai-review-runtime
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Publish GitHub Pull Request review
        if: steps.download.outcome == 'success'
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
          PYTHONPATH: .github/scripts
        run: >-
          python .github/scripts/ai_review_inline.py
          --pr "$PR_NUMBER"
          --result .ai-review-runtime/review-result.json

      - name: Report missing artifact
        if: steps.download.outcome != 'success'
        run: echo 'Validated AI review artifact is unavailable; legacy publisher remains authoritative.'
