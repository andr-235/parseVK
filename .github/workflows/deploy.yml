name: Deploy to Production Server

on:
  workflow_run:
    workflows: ["Full Release CI"]
    types:
      - completed
  workflow_dispatch:
    inputs:
      deployment:
        description: "Повторно развернуть текущий проверенный commit ветки main"
        required: true
        type: choice
        options:
          - current-main
        default: current-main

permissions:
  contents: read
  actions: read

concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  gate:
    name: Verify Release Gates
    runs-on: ubuntu-latest
    timeout-minutes: 25
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'workflow_dispatch' &&
        github.event.workflow_run.head_branch == 'main'
      )
    outputs:
      target_sha: ${{ steps.target.outputs.target_sha }}
      deploy: ${{ steps.quality.outputs.deploy }}
      gate_event: ${{ steps.target.outputs.gate_event }}
    steps:
      - name: Determine target commit
        id: target
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          WORKFLOW_RUN_SHA: ${{ github.event.workflow_run.head_sha }}
          WORKFLOW_RUN_EVENT: ${{ github.event.workflow_run.event }}
          MANUAL_REF: ${{ github.ref }}
          MANUAL_SHA: ${{ github.sha }}
          MANUAL_DEPLOYMENT: ${{ inputs.deployment }}
        run: |
          set -euo pipefail

          if [ "$EVENT_NAME" = "workflow_run" ]; then
            TARGET_SHA="$WORKFLOW_RUN_SHA"
            GATE_EVENT="$WORKFLOW_RUN_EVENT"
          else
            if [ "$MANUAL_DEPLOYMENT" != "current-main" ]; then
              echo "::error::Неизвестный режим ручного production deploy: $MANUAL_DEPLOYMENT"
              exit 1
            fi
            if [ "$MANUAL_REF" != "refs/heads/main" ]; then
              echo "::error::Ручной production deploy разрешён только из ветки main. Выбрано: $MANUAL_REF"
              exit 1
            fi
            TARGET_SHA="$MANUAL_SHA"
            COMMIT_MESSAGE="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${TARGET_SHA}" --jq '.commit.message')"
            if printf '%s' "$COMMIT_MESSAGE" | grep -qF '[skip ci]'; then
              GATE_EVENT="workflow_dispatch"
            else
              GATE_EVENT="push"
            fi
          fi

          MAIN_SHA="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"
          OBSOLETE=false
          if [ "$TARGET_SHA" != "$MAIN_SHA" ]; then
            OBSOLETE=true
            echo "Deployment candidate $TARGET_SHA is obsolete; current main is $MAIN_SHA"
          fi

          echo "target_sha=$TARGET_SHA" >> "$GITHUB_OUTPUT"
          echo "gate_event=$GATE_EVENT" >> "$GITHUB_OUTPUT"
          echo "obsolete=$OBSOLETE" >> "$GITHUB_OUTPUT"

      - name: Wait for required workflow results
        id: quality
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_SHA: ${{ steps.target.outputs.target_sha }}
          GATE_EVENT: ${{ steps.target.outputs.gate_event }}
          OBSOLETE: ${{ steps.target.outputs.obsolete }}
        run: |
          set -euo pipefail

          if [ "$OBSOLETE" = "true" ]; then
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          REQUIRED_WORKFLOWS=("Full Release CI" "Security Scanning")
          MAX_ATTEMPTS=60
          SLEEP_SECONDS=20

          for ((attempt=1; attempt<=MAX_ATTEMPTS; attempt++)); do
            RUNS_JSON="$(gh api \
              --method GET \
              "repos/${GITHUB_REPOSITORY}/actions/runs" \
              -f head_sha="$TARGET_SHA" \
              -f event="$GATE_EVENT" \
              -f branch=main \
              -f per_page=100)"

            pending=false
            for workflow in "${REQUIRED_WORKFLOWS[@]}"; do
              result="$(jq -r --arg workflow "$workflow" '
                [.workflow_runs[] | select(.name == $workflow)]
                | sort_by(.run_number)
                | last
                | if . == null then
                    "missing"
                  elif .status != "completed" then
                    .status
                  else
                    (.conclusion // "unknown")
                  end
              ' <<<"$RUNS_JSON")"

              echo "${workflow} (${GATE_EVENT}): ${result}"
              case "$result" in
                success)
                  ;;
                missing|queued|in_progress|requested|waiting|pending)
                  pending=true
                  ;;
                *)
                  echo "::error::${workflow} не прошёл для commit ${TARGET_SHA}: ${result}"
                  exit 1
                  ;;
              esac
            done

            if [ "$pending" = "false" ]; then
              echo "deploy=true" >> "$GITHUB_OUTPUT"
              echo "Все release gates пройдены для ${TARGET_SHA}"
              exit 0
            fi

            echo "Ожидание release gates для ${TARGET_SHA}: попытка ${attempt}/${MAX_ATTEMPTS}"
            sleep "$SLEEP_SECONDS"
          done

          echo "::error::Таймаут ожидания release gates для ${TARGET_SHA}"
          exit 1
