name: AI Code Review

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

concurrency:
  group: ai-code-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  review:
    name: AI Code Review
    if: >-
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
      GITHUB_REPOSITORY: ${{ github.repository }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Validate reviewer
        run: |
          python -m compileall -q .github/ai-review
          python -m unittest discover -s .github/ai-review/tests -v

      - name: Check Zen API access
        shell: bash
        run: |
          set -euo pipefail
          response_file="$(mktemp)"
          status="$(curl --silent --show-error \
            --output "$response_file" \
            --write-out '%{http_code}' \
            --request POST \
            'https://opencode.ai/zen/v1/chat/completions' \
            --header "Authorization: Bearer ${OPENCODE_API_KEY}" \
            --header 'Content-Type: application/json' \
            --header 'Accept: application/json' \
            --header 'User-Agent: parseVK-ai-reviewer/1.0' \
            --data '{"model":"big-pickle","messages":[{"role":"user","content":"Reply with OK only."}],"max_tokens":8}')"

          if [[ "$status" -lt 200 || "$status" -ge 300 ]]; then
            body="$(head -c 3000 "$response_file")"
            body="${body//${OPENCODE_API_KEY}/***}"
            echo "::error::Zen API HTTP ${status}: ${body}"
            exit 1
          fi

          echo "Zen API access confirmed (HTTP ${status})."

      - name: Review pull request
        run: python .github/ai-review/review.py
