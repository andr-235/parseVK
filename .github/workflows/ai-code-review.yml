name: AI Code Review

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: ai-code-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  review:
    name: AI Code Review
    if: >-
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Prepare review Issue
        id: issue
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE_JSON: ${{ toJSON(github.event.pull_request.title) }}
        run: |
          set -euo pipefail

          gh api \
            --method POST \
            "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/reactions" \
            -f content=eyes >/dev/null || true

          search_query="repo:${GITHUB_REPOSITORY} is:issue in:title \"[AI Review] PR #${PR_NUMBER}:\""
          issue_number="$(
            gh api \
              --method GET \
              search/issues \
              -f q="$search_query" \
              --jq '.items[0].number // empty'
          )"

          pr_title="$(jq -r '.' <<<"$PR_TITLE_JSON")"
          if (( ${#pr_title} > 180 )); then
            issue_title="${pr_title:0:177}..."
          else
            issue_title="$pr_title"
          fi
          title="[AI Review] PR #${PR_NUMBER}: ${issue_title}"
          body="$(cat <<EOF
          <!-- ai-review:pr=${PR_NUMBER} -->
          # AI Code Review для PR #${PR_NUMBER}

          👀 **Ревью выполняется**

          Анализ выполняет официальный OpenCode GitHub Action с моделью \`opencode/big-pickle\`.
          EOF
          )"

          if [[ -z "$issue_number" ]]; then
            issue_url="$(gh issue create \
              --repo "$GITHUB_REPOSITORY" \
              --title "$title" \
              --body "$body" \
              --label ai-review \
              --label ai-review:processing)"
            issue_number="${issue_url##*/}"
          else
            gh api \
              --method PATCH \
              "repos/${GITHUB_REPOSITORY}/issues/${issue_number}" \
              -f title="$title" \
              -f body="$body" \
              -f state=open \
              -f 'labels[]=ai-review' \
              -f 'labels[]=ai-review:processing' >/dev/null
          fi

          if [[ -z "$issue_number" ]]; then
            echo "::error::Не удалось создать или найти AI Review Issue"
            exit 1
          fi

          echo "issue_number=$issue_number" >> "$GITHUB_OUTPUT"

      - name: Run OpenCode review
        id: opencode
        if: success() && steps.issue.outputs.issue_number != ''
        uses: anomalyco/opencode/github@v1.17.7
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENCODE_DISABLE_PROJECT_CONFIG: "true"
          OPENCODE_PERMISSION: '{"bash":"deny","edit":"deny","task":"deny","skill":"deny","lsp":"deny","webfetch":"deny","websearch":"deny","external_directory":"deny"}'
        with:
          model: opencode/big-pickle
          use_github_token: true
          share: false
          prompt: |
            Проведи сфокусированное ревью кода текущего Pull Request проекта parseVK.

            Правила анализа:
            1. Анализируй только diff текущего PR и изменённые файлы с кодом,
               конфигурацией, миграциями, схемами и тестами.
            2. Полностью пропускай Markdown и документацию: `*.md`, `README*`, `docs/**`.
            3. Не проводи аудит всего репозитория. Дополнительный исходный файл можно открыть
               только если изменённый код прямо на него ссылается и без него нельзя подтвердить дефект.
            4. Не создавай todo-list и план. Не изменяй файлы, не запускай shell, команды `gh`,
               внешние процессы, subagents и не читай переменные окружения.
            5. Ищи только достижимые дефекты: correctness, security, reliability, data integrity,
               compatibility, performance и отсутствие теста для реально изменённого поведения.
            6. Не сообщай о форматировании, вкусовщине, документации, общих улучшениях,
               несуществующих сценариях и проблемах вне diff.
            7. Для каждого замечания укажи severity, файл, строку, сценарий ошибки,
               последствия, конкретное исправление и уверенность от 0 до 1.

            Формат финального ответа обязателен:
            - первая строка: короткий человеческий итог;
            - затем маркер `<!-- ai-review-result:${{ github.event.pull_request.head.sha }} -->`;
            - затем один JSON-блок без текста после него:

            ```json
            {
              "status": "completed",
              "summary": "Краткий итог ревью",
              "findings": [
                {
                  "severity": "blocker|major|minor|nit",
                  "file": "path/to/file",
                  "line": 123,
                  "scenario": "Как воспроизводится дефект",
                  "impact": "Последствия",
                  "fix": "Конкретное исправление",
                  "confidence": 0.95
                }
              ]
            }
            ```

            При невозможности закончить анализ используй `status: "technical-error"`,
            запиши причину в `summary` и оставь `findings` пустым. При отсутствии замечаний
            используй `status: "completed"` и пустой массив `findings`.

      - name: Publish and enforce review verdict
        if: always() && !cancelled()
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          ISSUE_NUMBER: ${{ steps.issue.outputs.issue_number }}
          REVIEW_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          OPENCODE_OUTCOME: ${{ steps.opencode.outcome }}
        run: |
          set -euo pipefail

          manual_review() {
            local reason="$1"

            if [[ -n "${ISSUE_NUMBER:-}" ]]; then
              local body
              body="$(cat <<EOF
          <!-- ai-review:pr=${PR_NUMBER} -->
          # AI Code Review для PR #${PR_NUMBER}

          **Вердикт:** \`manual-review\`

          ${reason}
          EOF
              )"

              gh api \
                --method PATCH \
                "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}" \
                -f body="$body" \
                -f state=open \
                -f 'labels[]=ai-review' \
                -f 'labels[]=ai-review:manual-review' >/dev/null || true
            fi

            echo "::error::${reason}"
            exit 2
          }

          if [[ -z "${ISSUE_NUMBER:-}" ]]; then
            echo "::error::Не удалось определить AI Review Issue"
            exit 2
          fi

          current_head="$(gh api \
            "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" \
            --jq '.head.sha')"

          if [[ "$current_head" != "$REVIEW_HEAD_SHA" ]]; then
            echo "Устаревший AI Review для ${REVIEW_HEAD_SHA} не публикуется; текущий HEAD ${current_head}"
            exit 0
          fi

          if [[ "$OPENCODE_OUTCOME" != "success" ]]; then
            manual_review "Шаг OpenCode завершился со статусом ${OPENCODE_OUTCOME}."
          fi

          marker="<!-- ai-review-result:${REVIEW_HEAD_SHA} -->"
          comments_json="$(gh api \
            --paginate \
            --slurp \
            "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments?per_page=100")"

          comment_body="$(jq -r --arg marker "$marker" '
            [.[][]
              | select(
                  .user.login == "github-actions[bot]" and
                  (.body | contains($marker))
                )]
            | sort_by(.id)
            | last
            | .body // empty
          ' <<<"$comments_json")"

          if [[ -z "$comment_body" ]]; then
            manual_review "Не найден структурированный результат OpenCode для HEAD ${REVIEW_HEAD_SHA}."
          fi

          result_json="$(awk '
            /^```json$/ { capture=1; next }
            /^```$/ && capture { exit }
            capture { print }
          ' <<<"$comment_body")"

          if [[ -z "$result_json" ]]; then
            manual_review "Комментарий OpenCode не содержит JSON-блок результата."
          fi

          if ! jq -e '
            (.status == "completed" or .status == "technical-error") and
            (.summary | type == "string") and
            (.findings | type == "array") and
            all(.findings[];
              ((.severity == "blocker") or
               (.severity == "major") or
               (.severity == "minor") or
               (.severity == "nit")) and
              (.file | type == "string") and
              ((.line == null) or (.line | type == "number")) and
              (.scenario | type == "string") and
              (.impact | type == "string") and
              (.fix | type == "string") and
              (.confidence | type == "number")
            )
          ' <<<"$result_json" >/dev/null; then
            manual_review "OpenCode вернул результат, не соответствующий ожидаемой JSON-схеме."
          fi

          status="$(jq -r '.status' <<<"$result_json")"
          summary="$(jq -r '.summary' <<<"$result_json")"

          if [[ "$status" == "technical-error" ]]; then
            manual_review "OpenCode не смог закончить анализ: ${summary}"
          fi

          blocking_count="$(jq '
            [.findings[]
              | select(
                  .severity == "blocker" or
                  (.severity == "major" and .confidence >= 0.8)
                )]
            | length
          ' <<<"$result_json")"

          finding_count="$(jq '.findings | length' <<<"$result_json")"
          verdict="approved"
          verdict_label="ai-review:approved"
          verdict_state="closed"
          exit_code=0

          if (( blocking_count > 0 )); then
            verdict="changes-required"
            verdict_label="ai-review:changes-required"
            verdict_state="open"
            exit_code=1
          fi

          issue_body_file="${RUNNER_TEMP}/ai-review-issue.md"
          {
            echo "<!-- ai-review:pr=${PR_NUMBER} -->"
            echo "# AI Code Review для PR #${PR_NUMBER}"
            echo
            echo "**Вердикт:** \`${verdict}\`"
            echo
            printf '%s\n' "$summary"

            if (( finding_count > 0 )); then
              echo
              echo "## Замечания"
              echo
              jq -r '
                .findings
                | to_entries[]
                | "### \(.key + 1). \(.value.severity | ascii_upcase)\n\n" +
                  "- **Файл:** `\(.value.file)`\n" +
                  "- **Строка:** \(.value.line // "не указана")\n" +
                  "- **Уверенность:** \(.value.confidence)\n" +
                  "- **Сценарий:** \(.value.scenario)\n" +
                  "- **Последствия:** \(.value.impact)\n" +
                  "- **Исправление:** \(.value.fix)\n"
              ' <<<"$result_json"
            else
              echo
              echo "Подтверждённых замечаний нет."
            fi
          } >"$issue_body_file"

          gh api \
            --method PATCH \
            "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}" \
            -f body="$(cat "$issue_body_file")" \
            -f state="$verdict_state" \
            -f 'labels[]=ai-review' \
            -f "labels[]=${verdict_label}" >/dev/null

          if [[ "$verdict_state" == "closed" ]]; then
            gh api \
              --method PATCH \
              "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}" \
              -f state=closed \
              -f state_reason=completed >/dev/null
          fi

          if (( exit_code == 1 )); then
            echo "::error::AI Review требует исправлений. Issue #${ISSUE_NUMBER}"
            exit 1
          fi

          echo "AI Review пройден. Issue #${ISSUE_NUMBER}"
