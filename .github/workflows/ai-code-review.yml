name: AI Code Review

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: ai-code-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  review:
    name: AI Code Review
    if: >-
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      PR_TITLE_JSON: ${{ toJSON(github.event.pull_request.title) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Prepare review Issue
        id: issue
        shell: bash
        run: |
          set -euo pipefail

          gh api \
            --method POST \
            "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/reactions" \
            -f content=eyes >/dev/null || true

          search_query="repo:${GITHUB_REPOSITORY} is:issue in:title \"[AI Review] PR #${PR_NUMBER}:\""
          issue_number="$(
            gh api \
              --method GET \
              search/issues \
              -f q="$search_query" \
              --jq '.items[0].number // empty'
          )"

          pr_title="$(jq -r '.' <<<"$PR_TITLE_JSON")"
          title="[AI Review] PR #${PR_NUMBER}: ${pr_title:0:180}"
          body="$(cat <<EOF
          <!-- ai-review:pr=${PR_NUMBER} -->
          # AI Code Review для PR #${PR_NUMBER}

          👀 **Ревью выполняется**

          Анализ выполняет официальный OpenCode GitHub Action с моделью \`opencode/big-pickle\`.
          EOF
          )"

          if [[ -z "$issue_number" ]]; then
            issue_url="$(gh issue create \
              --repo "$GITHUB_REPOSITORY" \
              --title "$title" \
              --body "$body" \
              --label ai-review \
              --label ai-review:processing)"
            issue_number="${issue_url##*/}"
          else
            gh api \
              --method PATCH \
              "repos/${GITHUB_REPOSITORY}/issues/${issue_number}" \
              -f title="$title" \
              -f body="$body" \
              -f state=open \
              -f 'labels[]=ai-review' \
              -f 'labels[]=ai-review:processing' >/dev/null
          fi

          echo "issue_number=$issue_number" >> "$GITHUB_OUTPUT"

      - name: Run OpenCode review
        id: opencode
        uses: anomalyco/opencode/github@v1.17.7
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          model: opencode/big-pickle
          use_github_token: true
          share: false
          prompt: |
            Проведи строгое ревью текущего Pull Request проекта parseVK.

            Обязательные правила:
            1. Прочитай `.github/ai-review/rules.md` и `docs/architecture.md`.
            2. Анализируй только изменения текущего PR. Не изменяй файлы, не создавай commits и ветки.
            3. Ищи достижимые дефекты: correctness, security, architecture, reliability,
               data integrity, compatibility, performance и отсутствие необходимых тестов.
            4. Не блокируй PR из-за форматирования, вкусовщины или некритичных улучшений.
            5. Используй только существующий Issue #${{ steps.issue.outputs.issue_number }}.
               Не создавай другие Issue.
            6. Полностью обнови тело Issue. Сохрани первой строкой маркер:
               `<!-- ai-review:pr=${{ github.event.pull_request.number }} -->`.
            7. Для каждого замечания укажи severity, файл, строку, сценарий ошибки,
               последствия, конкретное исправление и уверенность.
            8. Если есть хотя бы один подтверждённый blocker или major с уверенностью >= 0.8:
               - оставь Issue открытым;
               - замени labels на `ai-review` и `ai-review:changes-required`.
            9. Если блокирующих замечаний нет:
               - укажи minor/nit рекомендации в Issue, если они есть;
               - замени labels на `ai-review` и `ai-review:approved`;
               - закрой Issue как completed.
            10. Если анализ невозможно закончить технически:
                - оставь Issue открытым;
                - замени labels на `ai-review` и `ai-review:manual-review`;
                - запиши точную причину.
            11. Оставь в PR один краткий комментарий со ссылкой на Issue и итогом.

      - name: Enforce review verdict
        if: always() && !cancelled()
        shell: bash
        env:
          ISSUE_NUMBER: ${{ steps.issue.outputs.issue_number }}
        run: |
          set -euo pipefail

          if [[ -z "${ISSUE_NUMBER:-}" ]]; then
            echo "::error::Не удалось определить AI Review Issue"
            exit 2
          fi

          issue_json="$(gh api "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}")"
          labels="$(jq -r '.labels[].name' <<<"$issue_json")"
          state="$(jq -r '.state' <<<"$issue_json")"

          if grep -qx 'ai-review:changes-required' <<<"$labels"; then
            echo "::error::AI Review требует исправлений. Issue #${ISSUE_NUMBER}"
            exit 1
          fi

          if grep -qx 'ai-review:approved' <<<"$labels"; then
            if [[ "$state" != "closed" ]]; then
              gh issue close "$ISSUE_NUMBER" \
                --repo "$GITHUB_REPOSITORY" \
                --reason completed >/dev/null
            fi
            echo "AI Review пройден. Issue #${ISSUE_NUMBER}"
            exit 0
          fi

          gh api \
            --method PATCH \
            "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}" \
            -f state=open \
            -f 'labels[]=ai-review' \
            -f 'labels[]=ai-review:manual-review' >/dev/null

          echo "::error::OpenCode не опубликовал однозначный verdict. Нужна ручная проверка Issue #${ISSUE_NUMBER}"
          exit 2
