name: AI Code Review

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened, ready_for_review, closed]

concurrency:
  group: ai-code-review-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha || github.run_id }}
  cancel-in-progress: false

permissions: {}

env:
  PYTHONUNBUFFERED: "1"
  AI_REVIEW_SCRIPT: .github/scripts/ai_review.py
  AI_REVIEW_AGENTS_SCRIPT: .github/scripts/ai_review_agents.py
  AI_REVIEW_BATCH_SCRIPT: .github/scripts/ai_review_batch.py

jobs:
  prepare:
    name: Mark review in progress
    if: >-
      github.event.action != 'closed' &&
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login == github.repository_owner &&
      github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout trusted reviewer code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
          sparse-checkout: |
            .github/scripts/ai_review.py
          sparse-checkout-cone-mode: false

      - name: Add processing reaction
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: python "$AI_REVIEW_SCRIPT" mark --pr "$PR_NUMBER"

  plan:
    name: Plan commit reviews
    if: >-
      github.event.action != 'closed' &&
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login == github.repository_owner &&
      github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      count: ${{ steps.plan.outputs.count }}
      status: ${{ steps.plan.outputs.status }}
    steps:
      - name: Checkout trusted commit planner
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
          sparse-checkout: |
            .github/scripts/ai_review_batch.py
            .github/scripts/ai_review_batch_lib
            .github/scripts/test_ai_review_batch.py
            .github/scripts/test_ai_review_batch_plan_edges.py
          sparse-checkout-cone-mode: false

      - name: Isolate trusted commit planner
        run: |
          trusted_dir="$RUNNER_TEMP/ai-review-batch"
          mkdir -p "$trusted_dir"
          batch_script=""
          if [[ -f .github/scripts/ai_review_batch.py ]]; then
            cp .github/scripts/ai_review_batch.py "$trusted_dir/ai_review_batch.py"
            cp -R .github/scripts/ai_review_batch_lib "$trusted_dir/ai_review_batch_lib"
            batch_script="$trusted_dir/ai_review_batch.py"
          fi
          shopt -s nullglob
          for test_file in .github/scripts/test_ai_review_batch*.py; do
            cp "$test_file" "$trusted_dir/${test_file##*/}"
          done
          {
            echo "TRUSTED_BATCH_DIR=$trusted_dir"
            echo "AI_REVIEW_BATCH_SCRIPT=$batch_script"
          } >> "$GITHUB_ENV"

      - name: Test trusted commit planner
        if: env.AI_REVIEW_BATCH_SCRIPT != ''
        run: >-
          PYTHONPATH="$TRUSTED_BATCH_DIR"
          python -m unittest discover
          -s "$TRUSTED_BATCH_DIR"
          -p 'test_ai_review_batch*.py'
          -v

      - name: Checkout Pull Request history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Build commit review plan
        id: plan
        env:
          ACTION: ${{ github.event.action }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          mkdir -p .ai-review-runtime
          if [[ -n "$AI_REVIEW_BATCH_SCRIPT" ]]; then
            PYTHONPATH="$TRUSTED_BATCH_DIR" python "$AI_REVIEW_BATCH_SCRIPT" plan \
              --action "$ACTION" \
              --base "$BASE_SHA" \
              --before "$BEFORE_SHA" \
              --head "$HEAD_SHA" \
              --repo "$GITHUB_WORKSPACE" \
              --output .ai-review-runtime/commit-plan.json \
              --github-output "$GITHUB_OUTPUT"
          else
            parent_sha="$(git rev-parse "${HEAD_SHA}^1")"
            python - "$parent_sha" "$HEAD_SHA" "$GITHUB_OUTPUT" <<'PY'
          import json
          import sys
          from pathlib import Path

          parent, head, output_path = sys.argv[1:]
          unit = {"index": "001", "base_sha": parent, "head_sha": head}
          plan = {
              "schema_version": 1,
              "run_head_sha": head,
              "start_sha": parent,
              "status": "review",
              "reason": "bootstrap-single-commit",
              "units": [unit],
              "commit_count": 1,
              "new_commit_count": 1,
          }
          Path(".ai-review-runtime/commit-plan.json").write_text(
              json.dumps(plan, indent=2) + "\n",
              encoding="utf-8",
          )
          with Path(output_path).open("a", encoding="utf-8") as output:
              output.write(f"matrix={json.dumps([unit], separators=(',', ':'))}\n")
              output.write("count=1\n")
              output.write("status=review\n")
          PY
          fi

      - name: Upload commit review plan
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ai-review-plan-${{ github.run_id }}
          path: .ai-review-runtime/commit-plan.json
          if-no-files-found: error
          retention-days: 1

  review:
    name: Review commit ${{ matrix.unit.index }}
    needs: [plan]
    if: >-
      needs.plan.outputs.status == 'review' &&
      needs.plan.outputs.count != '0'
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        unit: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      AI_REVIEW_DIR: ${{ github.workspace }}/.ai-review-runtime/${{ matrix.unit.index }}
    steps:
      - name: Checkout trusted reviewer code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
          sparse-checkout: |
            .github/scripts/ai_review.py
            .github/scripts/ai_review_agents.py
            .github/scripts/test_ai_review.py
            .github/scripts/test_ai_review_agents.py
          sparse-checkout-cone-mode: false

      - name: Isolate trusted reviewer code
        run: |
          trusted_dir="$RUNNER_TEMP/ai-review-trusted"
          mkdir -p "$trusted_dir"
          cp .github/scripts/ai_review.py "$trusted_dir/ai_review.py"
          cp .github/scripts/test_ai_review.py "$trusted_dir/test_ai_review.py"
          agents_script=""
          if [[ -f .github/scripts/ai_review_agents.py ]]; then
            cp .github/scripts/ai_review_agents.py "$trusted_dir/ai_review_agents.py"
            agents_script="$trusted_dir/ai_review_agents.py"
          fi
          if [[ -f .github/scripts/test_ai_review_agents.py ]]; then
            cp .github/scripts/test_ai_review_agents.py "$trusted_dir/test_ai_review_agents.py"
          fi
          {
            echo "TRUSTED_REVIEWER_DIR=$trusted_dir"
            echo "AI_REVIEW_SCRIPT=$trusted_dir/ai_review.py"
            echo "AI_REVIEW_AGENTS_SCRIPT=$agents_script"
          } >> "$GITHUB_ENV"

      - name: Checkout reviewed commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ matrix.unit.head_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Test trusted reviewer logic
        id: self_test
        continue-on-error: true
        run: >-
          PYTHONPATH="$TRUSTED_REVIEWER_DIR"
          python -m unittest discover
          -s "$TRUSTED_REVIEWER_DIR"
          -p 'test_ai_review*.py'
          -v

      - name: Build commit review scope
        id: scope
        continue-on-error: true
        env:
          BASE_SHA: ${{ matrix.unit.base_sha }}
          HEAD_SHA: ${{ matrix.unit.head_sha }}
          TRUSTED_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          mkdir -p "$AI_REVIEW_DIR"
          python "$AI_REVIEW_SCRIPT" scope \
            --base "$BASE_SHA" \
            --head "$HEAD_SHA" \
            --output-dir "$AI_REVIEW_DIR"
          if [[ -n "$AI_REVIEW_AGENTS_SCRIPT" ]]; then
            python "$AI_REVIEW_AGENTS_SCRIPT" \
              --base "$TRUSTED_BASE_SHA" \
              --scope "$AI_REVIEW_DIR/scope.json" \
              --prompt-dir "$AI_REVIEW_DIR" \
              --repo "$GITHUB_WORKSPACE"
          fi
          echo "status=$(python -c 'import json,os; print(json.load(open(os.path.join(os.environ["AI_REVIEW_DIR"], "scope.json"), encoding="utf-8"))["status"])')" >> "$GITHUB_OUTPUT"

      - name: Checkout pinned OpenCode installer
        if: >-
          steps.self_test.outcome == 'success' &&
          steps.scope.outcome == 'success' &&
          steps.scope.outputs.status == 'review'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: anomalyco/opencode
          ref: 4ed4f749e644ffb5b279fb30b7b915e743d80142 # action v1.17.7
          path: .opencode-installer
          persist-credentials: false
          sparse-checkout: install
          sparse-checkout-cone-mode: false

      - name: Install pinned OpenCode CLI
        id: install
        if: >-
          steps.self_test.outcome == 'success' &&
          steps.scope.outcome == 'success' &&
          steps.scope.outputs.status == 'review'
        continue-on-error: true
        env:
          VERSION: 1.17.7
        run: |
          bash .opencode-installer/install --no-modify-path
          rm -rf .opencode-installer
          echo "$HOME/.opencode/bin" >> "$GITHUB_PATH"

      - name: Run OpenCode for reviewed commit
        id: opencode
        if: >-
          steps.scope.outputs.status == 'review' &&
          steps.install.outcome == 'success'
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          OPENCODE_DISABLE_PROJECT_CONFIG: "true"
          OPENCODE_CONFIG_CONTENT: >-
            {"default_agent":"plan","agent":{"plan":{"temperature":0,"prompt":"You are an automated commit code reviewer. Analyze only the attached commit diff and obey the exact JSON contract in the user prompt. Never return prose, Markdown, a plan, or tool-only output. If analysis cannot be completed, return status technical-error with the exact head_sha and an empty findings array."},"title":{"disable":true}}}
          OPENCODE_PERMISSION: >-
            {"read":{"*":"allow",".github/workflows/ai-code-review.yml":"deny","*.md":"deny","**/*.md":"deny","README*":"deny","**/README*":"deny","docs/**":"deny",".github/ai-review/**":"deny",".github/scripts/ai_review*":"deny"},"bash":"deny","edit":"deny","task":"deny","todowrite":"deny","skill":"deny","lsp":"deny","webfetch":"deny","websearch":"deny","external_directory":"deny","doom_loop":"deny"}
        run: |
          set +e
          exit_code=0
          shopt -s nullglob
          prompts=("$AI_REVIEW_DIR"/prompt-*.txt)
          for prompt in "${prompts[@]}"; do
            suffix="${prompt##*/prompt-}"
            suffix="${suffix%.txt}"
            opencode run \
              --format json \
              --model opencode/big-pickle \
              --agent plan \
              --no-share \
              --file "$AI_REVIEW_DIR/review-${suffix}.diff" \
              < "$prompt" \
              > "$AI_REVIEW_DIR/opencode-events-${suffix}.jsonl" \
              2> "$AI_REVIEW_DIR/opencode-${suffix}.stderr"
            chunk_exit=$?
            if (( chunk_exit != 0 )); then
              exit_code=$chunk_exit
              break
            fi
          done
          set -e
          echo "exit_code=$exit_code" >> "$GITHUB_OUTPUT"

      - name: Build validated commit result
        id: result
        if: always()
        env:
          HEAD_SHA: ${{ matrix.unit.head_sha }}
          TEST_OUTCOME: ${{ steps.self_test.outcome }}
          SCOPE_OUTCOME: ${{ steps.scope.outcome }}
          SCOPE_STATUS: ${{ steps.scope.outputs.status }}
          INSTALL_OUTCOME: ${{ steps.install.outcome }}
          OPENCODE_EXIT: ${{ steps.opencode.outputs.exit_code }}
        run: |
          result_path="$AI_REVIEW_DIR/review-result.json"
          artifact_dir="$RUNNER_TEMP/ai-review-artifact"
          artifact_path="$artifact_dir/${HEAD_SHA}.json"
          mkdir -p "$AI_REVIEW_DIR" "$artifact_dir"

          set +e
          if [[ "$TEST_OUTCOME" != "success" ]]; then
            python "$AI_REVIEW_SCRIPT" fallback \
              --head "$HEAD_SHA" \
              --reason reviewer-self-test-failed \
              --summary 'Внутренние тесты reviewer завершились ошибкой.' \
              --output "$result_path"
          elif [[ "$SCOPE_OUTCOME" != "success" ]]; then
            python "$AI_REVIEW_SCRIPT" fallback \
              --head "$HEAD_SHA" \
              --reason scope-failed \
              --summary 'Не удалось подготовить commit scope.' \
              --output "$result_path"
          elif [[ "$SCOPE_STATUS" == "review" && "$INSTALL_OUTCOME" != "success" ]]; then
            python "$AI_REVIEW_SCRIPT" fallback \
              --head "$HEAD_SHA" \
              --reason opencode-install-failed \
              --summary 'Не удалось установить закреплённую версию OpenCode CLI.' \
              --output "$result_path"
          else
            python "$AI_REVIEW_SCRIPT" finalize \
              --scope "$AI_REVIEW_DIR/scope.json" \
              --events "$AI_REVIEW_DIR" \
              --exit-code "${OPENCODE_EXIT:-0}" \
              --output "$result_path"
          fi
          result_exit=$?
          set -e

          if (( result_exit != 0 )) || [[ ! -s "$result_path" ]]; then
            python "$AI_REVIEW_SCRIPT" fallback \
              --head "$HEAD_SHA" \
              --reason result-generation-failed \
              --summary 'Reviewer не смог сформировать результат commit-review.' \
              --output "$result_path" || true
          fi
          if [[ ! -s "$result_path" ]]; then
            python - "$HEAD_SHA" "$result_path" <<'PY'
          import json
          import sys
          from pathlib import Path

          head, output = sys.argv[1:]
          value = {
              "schema_version": 1,
              "status": "technical-error",
              "reason": "emergency-fallback",
              "head_sha": head,
              "summary": "Reviewer не смог сформировать результат commit-review.",
              "findings": [],
              "dropped_findings": 0,
              "verdict": "unavailable",
              "reaction": "confused",
              "blocking_count": 0,
          }
          Path(output).write_text(
              json.dumps(value, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          PY
          fi

          cp "$result_path" "$artifact_path"
          echo "path=$artifact_path" >> "$GITHUB_OUTPUT"

      - name: Upload validated commit result
        if: always() && steps.result.outputs.path != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ai-review-commit-${{ github.run_id }}-${{ matrix.unit.index }}
          path: ${{ steps.result.outputs.path }}
          if-no-files-found: error
          retention-days: 1

  verdict:
    name: Evaluate review verdict
    needs: [prepare, plan, review]
    if: >-
      always() &&
      github.event.action != 'closed' &&
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login == github.repository_owner &&
      github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - name: Checkout trusted batch aggregator
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
          sparse-checkout: |
            .github/scripts/ai_review_batch.py
            .github/scripts/ai_review_batch_lib
          sparse-checkout-cone-mode: false

      - name: Isolate trusted batch aggregator
        run: |
          trusted_dir="$RUNNER_TEMP/ai-review-batch"
          mkdir -p "$trusted_dir"
          batch_script=""
          if [[ -f .github/scripts/ai_review_batch.py ]]; then
            cp .github/scripts/ai_review_batch.py "$trusted_dir/ai_review_batch.py"
            cp -R .github/scripts/ai_review_batch_lib "$trusted_dir/ai_review_batch_lib"
            batch_script="$trusted_dir/ai_review_batch.py"
          fi
          {
            echo "TRUSTED_BATCH_DIR=$trusted_dir"
            echo "AI_REVIEW_BATCH_SCRIPT=$batch_script"
          } >> "$GITHUB_ENV"

      - name: Download commit review plan
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ai-review-plan-${{ github.run_id }}
          path: .ai-review-runtime

      - name: Download validated commit results
        if: needs.plan.outputs.count != '0'
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: ai-review-commit-${{ github.run_id }}-*
          path: .ai-review-runtime/commit-results
          merge-multiple: true

      - name: Aggregate commit review results
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          mkdir -p .ai-review-runtime/commit-results
          if [[ -n "$AI_REVIEW_BATCH_SCRIPT" ]]; then
            PYTHONPATH="$TRUSTED_BATCH_DIR" python "$AI_REVIEW_BATCH_SCRIPT" aggregate \
              --plan .ai-review-runtime/commit-plan.json \
              --results-dir .ai-review-runtime/commit-results \
              --output .ai-review-runtime/review-result.json
          else
            first_result="$(find .ai-review-runtime/commit-results -name '*.json' -type f | head -n 1)"
            if [[ -n "$first_result" ]]; then
              cp "$first_result" .ai-review-runtime/review-result.json
            else
              python - "$HEAD_SHA" <<'PY'
          import json
          import sys
          from pathlib import Path

          head = sys.argv[1]
          value = {
              "schema_version": 1,
              "status": "technical-error",
              "reason": "bootstrap-result-missing",
              "head_sha": head,
              "summary": "Reviewer не сформировал commit result.",
              "findings": [],
              "dropped_findings": 0,
              "verdict": "unavailable",
              "reaction": "confused",
              "blocking_count": 0,
          }
          Path(".ai-review-runtime/review-result.json").write_text(
              json.dumps(value, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          PY
            fi
          fi

      - name: Upload validated result
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ai-review-result-${{ github.run_id }}
          path: |
            .ai-review-runtime/review-result.json
            .ai-review-runtime/commit-results/*.json
          if-no-files-found: error
          retention-days: 1

      - name: Evaluate validated verdict without publishing
        env:
          RESULT_PATH: .ai-review-runtime/review-result.json
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          payload = json.loads(Path(os.environ["RESULT_PATH"]).read_text(encoding="utf-8"))
          verdict = payload.get("verdict")
          print(f"AI Review verdict: {verdict}")
          print(payload.get("summary", ""))
          if verdict in {"changes-required", "review-required"}:
              raise SystemExit(1)
          if verdict == "unavailable":
              print("::warning::Commit review batch is partially unavailable.")
          PY

  status:
    name: Publish review status
    needs: [prepare, verdict]
    if: >-
      always() &&
      github.event.action != 'closed' &&
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login == github.repository_owner &&
      github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      pull-requests: write
    steps:
      - name: Download validated result
        id: result
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ai-review-result-${{ github.run_id }}
          path: .ai-review-runtime

      - name: Replace processing reaction with validated status
        env:
          DOWNLOAD_OUTCOME: ${{ steps.result.outcome }}
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          RESULT_PATH: .ai-review-runtime/review-result.json
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request
          from pathlib import Path

          api_url = os.environ.get("GITHUB_API_URL", "https://api.github.com").rstrip("/")
          repository = os.environ["GITHUB_REPOSITORY"]
          pr_number = os.environ["PR_NUMBER"]
          expected_head = os.environ["EXPECTED_HEAD"]
          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {os.environ['GITHUB_TOKEN']}",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "parsevk-ai-review-status",
          }

          def request(method: str, path: str, body=None):
              data = None if body is None else json.dumps(body).encode("utf-8")
              value = urllib.request.Request(
                  f"{api_url}{path}",
                  data=data,
                  headers=headers,
                  method=method,
              )
              with urllib.request.urlopen(value, timeout=30) as response:
                  payload = response.read()
              return json.loads(payload) if payload else None

          pull_request = request("GET", f"/repos/{repository}/pulls/{pr_number}")
          current_head = str((pull_request or {}).get("head", {}).get("sha") or "")
          if current_head != expected_head:
              print("::notice::Obsolete AI review run cannot update current PR status.")
              raise SystemExit(0)

          verdict = "unavailable"
          result_path = Path(os.environ["RESULT_PATH"])
          if os.environ.get("DOWNLOAD_OUTCOME") == "success" and result_path.is_file():
              payload = json.loads(result_path.read_text(encoding="utf-8"))
              if payload.get("head_sha") == expected_head:
                  verdict = str(payload.get("verdict") or "unavailable")

          reaction_by_verdict = {
              "approved": "+1",
              "changes-required": "-1",
              "findings": "confused",
              "review-required": "confused",
              "unavailable": "confused",
          }
          reactions = request(
              "GET",
              f"/repos/{repository}/issues/{pr_number}/reactions?per_page=100",
          )
          for reaction in reactions or []:
              user = reaction.get("user") or {}
              if user.get("login") != "github-actions[bot]":
                  continue
              request(
                  "DELETE",
                  f"/repos/{repository}/issues/{pr_number}/reactions/{reaction['id']}",
              )

          request(
              "POST",
              f"/repos/{repository}/issues/{pr_number}/reactions",
              {"content": reaction_by_verdict.get(verdict, "confused")},
          )
          print(f"Published AI review status: {verdict}")
          PY

  cleanup:
    name: Clean up closed Pull Request
    if: >-
      github.event.action == 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login == github.repository_owner
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - name: Checkout trusted cleanup code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
          sparse-checkout: |
            .github/scripts/ai_review.py
          sparse-checkout-cone-mode: false

      - name: Remove reactions, comments and close linked Issue
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          MERGED: ${{ github.event.pull_request.merged }}
        run: |
          args=()
          if [[ "$MERGED" == "true" ]]; then
            args+=(--merged)
          fi
          python "$AI_REVIEW_SCRIPT" cleanup --pr "$PR_NUMBER" "${args[@]}"
