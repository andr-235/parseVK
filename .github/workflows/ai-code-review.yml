name: AI Code Review

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: ai-code-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  review:
    name: AI Code Review
    if: >-
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Prepare review Issue
        id: issue
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE_JSON: ${{ toJSON(github.event.pull_request.title) }}
        run: |
          set -euo pipefail

          gh api \
            --method POST \
            "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/reactions" \
            -f content=eyes >/dev/null || true

          search_query="repo:${GITHUB_REPOSITORY} is:issue in:title \"[AI Review] PR #${PR_NUMBER}:\""
          issue_number="$(
            gh api \
              --method GET \
              search/issues \
              -f q="$search_query" \
              --jq '.items[0].number // empty'
          )"

          pr_title="$(jq -r '.' <<<"$PR_TITLE_JSON")"
          if (( ${#pr_title} > 180 )); then
            issue_title="${pr_title:0:177}..."
          else
            issue_title="$pr_title"
          fi
          title="[AI Review] PR #${PR_NUMBER}: ${issue_title}"
          body="$(cat <<EOF
          <!-- ai-review:pr=${PR_NUMBER} -->
          # AI Code Review для PR #${PR_NUMBER}

          👀 **Ревью выполняется**

          Анализ выполняет официальный OpenCode GitHub Action с моделью \`opencode/big-pickle\`.
          EOF
          )"

          if [[ -z "$issue_number" ]]; then
            issue_url="$(gh issue create \
              --repo "$GITHUB_REPOSITORY" \
              --title "$title" \
              --body "$body" \
              --label ai-review \
              --label ai-review:processing)"
            issue_number="${issue_url##*/}"
          else
            gh api \
              --method PATCH \
              "repos/${GITHUB_REPOSITORY}/issues/${issue_number}" \
              -f title="$title" \
              -f body="$body" \
              -f state=open \
              -f 'labels[]=ai-review' \
              -f 'labels[]=ai-review:processing' >/dev/null
          fi

          if [[ -z "$issue_number" ]]; then
            echo "::error::Не удалось создать или найти AI Review Issue"
            exit 1
          fi

          echo "issue_number=$issue_number" >> "$GITHUB_OUTPUT"

      - name: Run OpenCode review
        id: opencode
        if: success() && steps.issue.outputs.issue_number != ''
        uses: anomalyco/opencode/github@v1.17.7
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENCODE_DISABLE_PROJECT_CONFIG: "true"
          OPENCODE_PERMISSION: '{"bash":"deny","edit":"deny","task":"deny","skill":"deny","lsp":"deny","webfetch":"deny","websearch":"deny","external_directory":"deny"}'
        with:
          model: opencode/big-pickle
          use_github_token: true
          share: false
          prompt: |
            Проведи сфокусированное ревью кода текущего Pull Request проекта parseVK.

            Обязательные правила:
            1. Анализируй только diff текущего PR и только изменённые файлы с кодом,
               конфигурацией, миграциями, схемами и тестами.
            2. Полностью пропускай Markdown и документацию: `*.md`, `README*`, `docs/**`.
               Не читай `docs/architecture.md`, README и другие справочные документы.
            3. Не проводи аудит всего репозитория. Не просматривай посторонние сервисы,
               workflows и каталоги. Дополнительный исходный файл можно открыть только если
               изменённый код прямо на него ссылается и без него нельзя подтвердить дефект.
            4. Не создавай todo-list и отдельный план. Сразу проверь код и сформируй вердикт.
            5. Ищи только достижимые дефекты: correctness, security, reliability, data integrity,
               compatibility, performance и отсутствие теста для реально изменённого поведения.
            6. Не сообщай о форматировании, вкусовщине, документации, общих улучшениях,
               несуществующих сценариях и проблемах вне diff.
            7. Не изменяй файлы, не создавай commits и ветки.
            8. Не запускай shell, команды `gh`, внешние процессы и не читай переменные окружения.
               Эти возможности дополнительно заблокированы политикой выполнения.
            9. Используй только существующий Issue #${{ steps.issue.outputs.issue_number }}.
               Не читай его текущее тело и не создавай другие Issue.
            10. Отчёт должен быть коротким. Не перечисляй успешно проверенные категории и файлы.
                Для каждого реального замечания укажи severity, файл, строку, сценарий ошибки,
                последствия, конкретное исправление и уверенность.
            11. Если есть хотя бы один подтверждённый blocker или major с уверенностью >= 0.8:
                - одним финальным действием обнови Issue;
                - оставь его открытым;
                - замени labels на `ai-review` и `ai-review:changes-required`.
            12. Если блокирующих замечаний нет:
                - одним финальным действием обнови Issue кратким вердиктом;
                - замени labels на `ai-review` и `ai-review:approved`;
                - закрой Issue как completed.
            13. Если анализ невозможно закончить технически:
                - оставь Issue открытым;
                - замени labels на `ai-review` и `ai-review:manual-review`;
                - запиши точную причину.
            14. После записи результата не перечитывай Issue и не проверяй labels: это делает
                отдельный deterministic step workflow.
            15. Не создавай отдельный комментарий в PR. Верни короткий итог финальным ответом:
                официальный Action сам опубликует его в PR.

      - name: Enforce review verdict
        if: always() && !cancelled()
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ steps.issue.outputs.issue_number }}
        run: |
          set -euo pipefail

          if [[ -z "${ISSUE_NUMBER:-}" ]]; then
            echo "::error::Не удалось определить AI Review Issue"
            exit 2
          fi

          issue_json="$(gh api "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}")"
          labels="$(jq -r '.labels[].name' <<<"$issue_json")"
          state="$(jq -r '.state' <<<"$issue_json")"

          if grep -qx 'ai-review:changes-required' <<<"$labels"; then
            echo "::error::AI Review требует исправлений. Issue #${ISSUE_NUMBER}"
            exit 1
          fi

          if grep -qx 'ai-review:approved' <<<"$labels"; then
            if [[ "$state" != "closed" ]]; then
              gh issue close "$ISSUE_NUMBER" \
                --repo "$GITHUB_REPOSITORY" \
                --reason completed >/dev/null
            fi
            echo "AI Review пройден. Issue #${ISSUE_NUMBER}"
            exit 0
          fi

          gh api \
            --method PATCH \
            "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}" \
            -f state=open \
            -f 'labels[]=ai-review' \
            -f 'labels[]=ai-review:manual-review' >/dev/null

          echo "::error::OpenCode не опубликовал однозначный verdict. Нужна ручная проверка Issue #${ISSUE_NUMBER}"
          exit 2
