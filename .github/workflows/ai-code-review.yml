name: AI Code Review

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened, ready_for_review, closed]

concurrency:
  group: ai-code-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions: {}

env:
  PYTHONUNBUFFERED: "1"
  AI_REVIEW_SCRIPT: .github/scripts/ai_review.py
  AI_REVIEW_AGENTS_SCRIPT: .github/scripts/ai_review_agents.py

jobs:
  prepare:
    name: Mark review in progress
    if: >-
      github.event.action != 'closed' &&
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login == github.repository_owner &&
      github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout trusted reviewer code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
          sparse-checkout: |
            .github/scripts/ai_review.py
          sparse-checkout-cone-mode: false

      - name: Add processing reaction
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: python "$AI_REVIEW_SCRIPT" mark --pr "$PR_NUMBER"

  review:
    name: Analyze Pull Request
    env:
      AI_REVIEW_DIR: ${{ github.workspace }}/.ai-review-runtime
    if: >-
      github.event.action != 'closed' &&
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login == github.repository_owner &&
      github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Checkout trusted reviewer code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
          sparse-checkout: |
            .github/scripts/ai_review.py
            .github/scripts/ai_review_agents.py
            .github/scripts/test_ai_review.py
            .github/scripts/test_ai_review_agents.py
          sparse-checkout-cone-mode: false

      - name: Isolate trusted reviewer code
        run: |
          trusted_dir="$RUNNER_TEMP/ai-review-trusted"
          mkdir -p "$trusted_dir"
          cp .github/scripts/ai_review.py "$trusted_dir/ai_review.py"
          cp .github/scripts/test_ai_review.py "$trusted_dir/test_ai_review.py"
          agents_script=""
          if [[ -f .github/scripts/ai_review_agents.py ]]; then
            cp .github/scripts/ai_review_agents.py "$trusted_dir/ai_review_agents.py"
            agents_script="$trusted_dir/ai_review_agents.py"
          fi
          if [[ -f .github/scripts/test_ai_review_agents.py ]]; then
            cp .github/scripts/test_ai_review_agents.py "$trusted_dir/test_ai_review_agents.py"
          fi
          {
            echo "TRUSTED_REVIEWER_DIR=$trusted_dir"
            echo "AI_REVIEW_SCRIPT=$trusted_dir/ai_review.py"
            echo "AI_REVIEW_AGENTS_SCRIPT=$agents_script"
          } >> "$GITHUB_ENV"

      - name: Checkout Pull Request
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Test trusted reviewer logic
        id: self_test
        continue-on-error: true
        run: PYTHONPATH="$TRUSTED_REVIEWER_DIR" python -m unittest discover -s "$TRUSTED_REVIEWER_DIR" -p 'test_ai_review*.py' -v

      - name: Build review scope
        id: scope
        continue-on-error: true
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          mkdir -p "$AI_REVIEW_DIR"
          python "$AI_REVIEW_SCRIPT" scope \
            --base "$BASE_SHA" \
            --head "$HEAD_SHA" \
            --output-dir "$AI_REVIEW_DIR"
          if [[ -n "$AI_REVIEW_AGENTS_SCRIPT" ]]; then
            python "$AI_REVIEW_AGENTS_SCRIPT" \
              --base "$BASE_SHA" \
              --scope "$AI_REVIEW_DIR/scope.json" \
              --prompt-dir "$AI_REVIEW_DIR" \
              --repo "$GITHUB_WORKSPACE"
          else
            echo "Trusted base does not contain AGENTS.md injector yet; bootstrap run skips it."
          fi
          echo "status=$(python -c 'import json,os; print(json.load(open(os.path.join(os.environ["AI_REVIEW_DIR"], "scope.json"), encoding="utf-8"))["status"])')" >> "$GITHUB_OUTPUT"

      - name: Debounce rapid commits
        id: freshness
        if: >-
          steps.self_test.outcome == 'success' &&
          steps.scope.outcome == 'success' &&
          steps.scope.outputs.status == 'review'
        env:
          CURRENT_HEAD_URL: ${{ github.event.pull_request.url }}
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          sleep 45
          current_head="$(curl --fail --silent --show-error \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "$CURRENT_HEAD_URL" | python -c 'import json,sys; print(json.load(sys.stdin)["head"]["sha"])')"
          if [[ "$current_head" == "$EXPECTED_HEAD" ]]; then
            echo "fresh=true" >> "$GITHUB_OUTPUT"
          else
            echo "fresh=false" >> "$GITHUB_OUTPUT"
            echo "Newer commit detected; OpenCode will not run for ${EXPECTED_HEAD}."
          fi

      - name: Checkout pinned OpenCode installer
        if: steps.freshness.outputs.fresh == 'true'
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: anomalyco/opencode
          ref: 4ed4f749e644ffb5b279fb30b7b915e743d80142 # action v1.17.7
          path: .opencode-installer
          persist-credentials: false
          sparse-checkout: install
          sparse-checkout-cone-mode: false

      - name: Install pinned OpenCode CLI
        id: install
        if: steps.freshness.outputs.fresh == 'true'
        continue-on-error: true
        env:
          VERSION: 1.17.7
        run: |
          bash .opencode-installer/install --no-modify-path
          rm -rf .opencode-installer
          echo "$HOME/.opencode/bin" >> "$GITHUB_PATH"

      - name: Run OpenCode without GitHub publishing
        id: opencode
        if: >-
          steps.freshness.outputs.fresh == 'true' &&
          steps.install.outcome == 'success'
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          OPENCODE_DISABLE_PROJECT_CONFIG: "true"
          OPENCODE_CONFIG_CONTENT: >-
            {"default_agent":"plan","agent":{"plan":{"temperature":0,"prompt":"You are an automated Pull Request code reviewer. Analyze only the attached diff and obey the exact JSON contract in the user prompt. Never return prose, Markdown, a plan, or tool-only output. If analysis cannot be completed, return status technical-error with the exact head_sha and an empty findings array."},"title":{"disable":true}}}
          OPENCODE_PERMISSION: >-
            {"read":{"*":"allow",".github/workflows/ai-code-review.yml":"deny","*.md":"deny","**/*.md":"deny","README*":"deny","**/README*":"deny","docs/**":"deny",".github/ai-review/**":"deny",".github/scripts/ai_review*":"deny"},"bash":"deny","edit":"deny","task":"deny","todowrite":"deny","skill":"deny","lsp":"deny","webfetch":"deny","websearch":"deny","external_directory":"deny","doom_loop":"deny"}
        run: |
          set +e
          exit_code=0
          shopt -s nullglob
          prompts=("$AI_REVIEW_DIR"/prompt-*.txt)
          if (( ${#prompts[@]} == 0 )); then
            echo "::error::Reviewer scope did not produce any prompt chunks."
            exit_code=2
          else
            for prompt in "${prompts[@]}"; do
              suffix="${prompt##*/prompt-}"
              suffix="${suffix%.txt}"
              diff="$AI_REVIEW_DIR/review-${suffix}.diff"
              events="$AI_REVIEW_DIR/opencode-events-${suffix}.jsonl"
              stderr="$AI_REVIEW_DIR/opencode-${suffix}.stderr"
              echo "Running AI review chunk ${suffix} of ${#prompts[@]}."
              opencode run \
                --format json \
                --model opencode/big-pickle \
                --agent plan \
                --no-share \
                --file "$diff" \
                < "$prompt" \
                > "$events" \
                2> "$stderr"
              chunk_exit=$?
              if (( chunk_exit != 0 )); then
                exit_code=$chunk_exit
                break
              fi
            done
          fi
          set -e
          echo "exit_code=$exit_code" >> "$GITHUB_OUTPUT"
          if (( exit_code != 0 )); then
            echo "::warning::OpenCode exited with code ${exit_code}."
          fi

      - name: Build validated review result
        id: finalize
        continue-on-error: true
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          TEST_OUTCOME: ${{ steps.self_test.outcome }}
          SCOPE_OUTCOME: ${{ steps.scope.outcome }}
          SCOPE_STATUS: ${{ steps.scope.outputs.status }}
          FRESH: ${{ steps.freshness.outputs.fresh }}
          INSTALL_OUTCOME: ${{ steps.install.outcome }}
          OPENCODE_EXIT: ${{ steps.opencode.outputs.exit_code }}
        run: |
          mkdir -p "$AI_REVIEW_DIR"
          if [[ "$TEST_OUTCOME" != "success" ]]; then
            python "$AI_REVIEW_SCRIPT" fallback \
              --head "$HEAD_SHA" \
              --reason reviewer-self-test-failed \
              --summary 'Внутренние тесты reviewer завершились ошибкой.' \
              --output "$AI_REVIEW_DIR/review-result.json"
          elif [[ "$SCOPE_OUTCOME" != "success" ]]; then
            python "$AI_REVIEW_SCRIPT" fallback \
              --head "$HEAD_SHA" \
              --reason scope-failed \
              --summary 'Не удалось подготовить область или доверенные инструкции AI-ревью.' \
              --output "$AI_REVIEW_DIR/review-result.json"
          elif [[ "${FRESH:-true}" == "false" ]]; then
            python "$AI_REVIEW_SCRIPT" fallback \
              --head "$HEAD_SHA" \
              --reason obsolete-run \
              --summary 'Запуск устарел до обращения к модели.' \
              --output "$AI_REVIEW_DIR/review-result.json"
          elif [[ "$SCOPE_STATUS" == "review" && "$INSTALL_OUTCOME" != "success" ]]; then
            python "$AI_REVIEW_SCRIPT" fallback \
              --head "$HEAD_SHA" \
              --reason opencode-install-failed \
              --summary 'Не удалось установить закреплённую версию OpenCode CLI.' \
              --output "$AI_REVIEW_DIR/review-result.json"
          else
            python "$AI_REVIEW_SCRIPT" finalize \
              --scope "$AI_REVIEW_DIR/scope.json" \
              --events "$AI_REVIEW_DIR" \
              --exit-code "${OPENCODE_EXIT:-0}" \
              --output "$AI_REVIEW_DIR/review-result.json"
          fi

      - name: Ensure a publishable result exists
        if: always()
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          mkdir -p "$AI_REVIEW_DIR"
          if [[ ! -s "$AI_REVIEW_DIR/review-result.json" ]]; then
            python "$AI_REVIEW_SCRIPT" fallback \
              --head "$HEAD_SHA" \
              --reason result-generation-failed \
              --summary 'Reviewer не смог сформировать итоговый результат.' \
              --output "$AI_REVIEW_DIR/review-result.json"
          fi

      - name: Upload validated result
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ai-review-result-${{ github.run_id }}
          path: ${{ github.workspace }}/.ai-review-runtime/review-result.json
          if-no-files-found: error
          retention-days: 1

  verdict:
    name: Evaluate review verdict
    needs: [prepare, review]
    if: >-
      always() &&
      github.event.action != 'closed' &&
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login == github.repository_owner &&
      github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - name: Download validated result
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ai-review-result-${{ github.run_id }}
          path: ${{ github.workspace }}/.ai-review-runtime

      - name: Evaluate validated verdict without publishing
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
          RESULT_PATH: ${{ github.workspace }}/.ai-review-runtime/review-result.json
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          result_path = Path(os.environ["RESULT_PATH"])
          try:
              payload = json.loads(result_path.read_text(encoding="utf-8"))
          except (OSError, json.JSONDecodeError) as error:
              print(f"::error::Cannot read validated AI review result: {error}")
              raise SystemExit(2) from error

          expected_head = os.environ["EXPECTED_HEAD"]
          if payload.get("head_sha") != expected_head:
              print("::error::Validated AI review result belongs to another HEAD.")
              raise SystemExit(2)

          verdict = payload.get("verdict")
          allowed = {
              "approved",
              "changes-required",
              "findings",
              "review-required",
              "unavailable",
          }
          if verdict not in allowed:
              print(f"::error::Unsupported AI review verdict: {verdict!r}")
              raise SystemExit(2)

          summary = str(payload.get("summary") or "AI review produced no summary.")
          blocking = int(payload.get("blocking_count") or 0)
          findings = payload.get("findings")
          finding_count = len(findings) if isinstance(findings, list) else 0
          print(f"AI Review verdict: {verdict}")
          print(f"Findings: {finding_count}; blocking: {blocking}")
          print(summary)

          summary_path = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary_path:
              with open(summary_path, "a", encoding="utf-8") as stream:
                  stream.write("## AI Code Review verdict\n\n")
                  stream.write(f"- Verdict: `{verdict}`\n")
                  stream.write(f"- Findings: {finding_count}\n")
                  stream.write(f"- Blocking: {blocking}\n\n")
                  stream.write(f"{summary}\n")

          if verdict in {"changes-required", "review-required"}:
              print(f"::error::AI Review verdict blocks this Pull Request: {verdict}")
              raise SystemExit(1)
          if verdict == "unavailable":
              print(f"::warning::{summary}")
          PY

  status:
    name: Publish review status
    needs: [prepare, review, verdict]
    if: >-
      always() &&
      github.event.action != 'closed' &&
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login == github.repository_owner &&
      github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      pull-requests: write
    steps:
      - name: Download validated result
        id: result
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ai-review-result-${{ github.run_id }}
          path: ${{ github.workspace }}/.ai-review-runtime

      - name: Replace processing reaction with validated status
        env:
          DOWNLOAD_OUTCOME: ${{ steps.result.outcome }}
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          RESULT_PATH: ${{ github.workspace }}/.ai-review-runtime/review-result.json
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request
          from pathlib import Path

          api_url = os.environ.get("GITHUB_API_URL", "https://api.github.com").rstrip("/")
          repository = os.environ["GITHUB_REPOSITORY"]
          pr_number = os.environ["PR_NUMBER"]
          expected_head = os.environ["EXPECTED_HEAD"]
          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {os.environ['GITHUB_TOKEN']}",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "parsevk-ai-review-status",
          }

          def request(method: str, path: str, body=None):
              data = None if body is None else json.dumps(body).encode("utf-8")
              value = urllib.request.Request(
                  f"{api_url}{path}",
                  data=data,
                  headers=headers,
                  method=method,
              )
              with urllib.request.urlopen(value, timeout=30) as response:
                  payload = response.read()
              return json.loads(payload) if payload else None

          pull_request = request("GET", f"/repos/{repository}/pulls/{pr_number}")
          current_head = str((pull_request or {}).get("head", {}).get("sha") or "")
          if current_head != expected_head:
              print("::notice::Obsolete AI review run cannot update current PR status.")
              raise SystemExit(0)

          verdict = "unavailable"
          result_path = Path(os.environ["RESULT_PATH"])
          if os.environ.get("DOWNLOAD_OUTCOME") == "success" and result_path.is_file():
              try:
                  payload = json.loads(result_path.read_text(encoding="utf-8"))
              except (OSError, json.JSONDecodeError) as error:
                  print(f"::warning::Cannot read AI review status artifact: {error}")
              else:
                  if payload.get("head_sha") == expected_head:
                      candidate = payload.get("verdict")
                      if candidate in {
                          "approved",
                          "changes-required",
                          "findings",
                          "review-required",
                          "unavailable",
                      }:
                          verdict = candidate

          reaction_by_verdict = {
              "approved": "+1",
              "changes-required": "-1",
              "findings": "confused",
              "review-required": "confused",
              "unavailable": "confused",
          }
          reactions = request(
              "GET",
              f"/repos/{repository}/issues/{pr_number}/reactions?per_page=100",
          )
          for reaction in reactions or []:
              user = reaction.get("user") or {}
              if user.get("login") != "github-actions[bot]":
                  continue
              request(
                  "DELETE",
                  f"/repos/{repository}/issues/{pr_number}/reactions/{reaction['id']}",
              )

          final_reaction = reaction_by_verdict[verdict]
          request(
              "POST",
              f"/repos/{repository}/issues/{pr_number}/reactions",
              {"content": final_reaction},
          )
          print(f"Published AI review status: {verdict}")
          PY

  cleanup:
    name: Clean up closed Pull Request
    if: >-
      github.event.action == 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login == github.repository_owner
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - name: Checkout trusted cleanup code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
          sparse-checkout: |
            .github/scripts/ai_review.py
          sparse-checkout-cone-mode: false

      - name: Remove reactions, comments and close linked Issue
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          MERGED: ${{ github.event.pull_request.merged }}
        run: |
          args=()
          if [[ "$MERGED" == "true" ]]; then
            args+=(--merged)
          fi
          python "$AI_REVIEW_SCRIPT" cleanup --pr "$PR_NUMBER" "${args[@]}"
