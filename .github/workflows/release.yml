name: Release

on:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed
  workflow_dispatch:

permissions:
  actions: write
  contents: write
  issues: write
  pull-requests: write
  id-token: write

concurrency:
  group: semantic-release-main
  cancel-in-progress: false

jobs:
  release:
    name: Semantic Release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_branch == 'main'
      )

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.ref }}

      - name: Detect release commit
        id: release_commit
        shell: bash
        run: |
          set -euo pipefail

          SOURCE_SHA="$(git rev-parse HEAD)"
          COMMIT_MESSAGE="$(git log -1 --format=%B)"
          echo "source_sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"
          if printf '%s' "$COMMIT_MESSAGE" | grep -qF '[skip ci]'; then
            echo "skip_release=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip_release=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify source commit is current main
        id: source_gate
        if: steps.release_commit.outputs.skip_release != 'true'
        shell: bash
        env:
          SOURCE_SHA: ${{ steps.release_commit.outputs.source_sha }}
        run: |
          set -euo pipefail

          CURRENT_MAIN="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          if [[ "$CURRENT_MAIN" != "$SOURCE_SHA" ]]; then
            echo "stale=true" >> "$GITHUB_OUTPUT"
            echo "Skipping stale CI source $SOURCE_SHA; main is $CURRENT_MAIN"
          else
            echo "stale=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node.js
        if: >-
          steps.release_commit.outputs.skip_release != 'true' &&
          steps.source_gate.outputs.stale != 'true'
        uses: actions/setup-node@v6
        with:
          node-version: "20"

      - name: Install semantic-release
        if: >-
          steps.release_commit.outputs.skip_release != 'true' &&
          steps.source_gate.outputs.stale != 'true'
        run: |
          npm install --no-save \
            semantic-release \
            @semantic-release/commit-analyzer \
            @semantic-release/release-notes-generator \
            @semantic-release/changelog \
            @semantic-release/exec \
            @semantic-release/npm \
            @semantic-release/git \
            @semantic-release/github

      - name: Release
        if: >-
          steps.release_commit.outputs.skip_release != 'true' &&
          steps.source_gate.outputs.stale != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: github-actions[bot]@users.noreply.github.com
        run: npx semantic-release

      - name: Resolve semantic release commit
        id: resolved_release
        if: >-
          steps.release_commit.outputs.skip_release != 'true' &&
          steps.source_gate.outputs.stale != 'true'
        shell: bash
        env:
          SOURCE_SHA: ${{ steps.release_commit.outputs.source_sha }}
        run: |
          set -euo pipefail

          git fetch --no-tags origin main
          RELEASE_SHA="$(git rev-parse origin/main)"
          if [[ "$RELEASE_SHA" == "$SOURCE_SHA" ]]; then
            echo "created=false" >> "$GITHUB_OUTPUT"
            echo "Semantic Release did not create a new commit."
            exit 0
          fi

          RELEASE_PARENT="$(git rev-parse "${RELEASE_SHA}^")"
          RELEASE_SUBJECT="$(git show -s --format=%s "$RELEASE_SHA")"
          RELEASE_MESSAGE="$(git show -s --format=%B "$RELEASE_SHA")"
          REMOTE_MAIN="$(git ls-remote origin refs/heads/main | awk '{print $1}')"

          [[ "$REMOTE_MAIN" == "$RELEASE_SHA" ]] || {
            echo "::error::Release commit is no longer current main: release=$RELEASE_SHA main=$REMOTE_MAIN"
            exit 1
          }
          [[ "$RELEASE_PARENT" == "$SOURCE_SHA" ]] || {
            echo "::error::Release commit parent mismatch: expected=$SOURCE_SHA actual=$RELEASE_PARENT"
            exit 1
          }
          [[ "$RELEASE_SUBJECT" == chore\(release\):* ]] || {
            echo "::error::Unexpected release commit subject: $RELEASE_SUBJECT"
            exit 1
          }
          printf '%s' "$RELEASE_MESSAGE" | grep -qF '[skip ci]' || {
            echo "::error::Release commit must contain [skip ci] to prevent push recursion"
            exit 1
          }

          {
            echo "created=true"
            echo "release_sha=$RELEASE_SHA"
          } >> "$GITHUB_OUTPUT"

      - name: Dispatch and confirm release commit gates
        if: steps.resolved_release.outputs.created == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_SHA: ${{ steps.release_commit.outputs.source_sha }}
          RELEASE_SHA: ${{ steps.resolved_release.outputs.release_sha }}
        run: |
          set -euo pipefail

          CURRENT_MAIN="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          [[ "$CURRENT_MAIN" == "$RELEASE_SHA" ]] || {
            echo "::error::Refusing gate dispatch for stale release $RELEASE_SHA; main is $CURRENT_MAIN"
            exit 1
          }

          latest_dispatch_run_id() {
            local workflow_file="$1"
            gh api --method GET \
              "repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow_file}/runs" \
              -f branch=main \
              -f event=workflow_dispatch \
              -f per_page=20 |
              jq -r --arg sha "$RELEASE_SHA" '
                [.workflow_runs[] | select(.head_sha == $sha and .event == "workflow_dispatch")]
                | sort_by(.created_at)
                | last
                | .id // empty
              '
          }

          PRE_CI_RUN_ID="$(latest_dispatch_run_id ci.yml)"
          PRE_SECURITY_RUN_ID="$(latest_dispatch_run_id security.yml)"

          CI_PAYLOAD="$(jq -nc \
            --arg target_sha "$RELEASE_SHA" \
            --arg base_sha "$SOURCE_SHA" \
            '{
              ref: "main",
              inputs: {
                target_sha: $target_sha,
                base_sha: $base_sha,
                full_validation: true
              }
            }')"
          SECURITY_PAYLOAD="$(jq -nc \
            --arg target_sha "$RELEASE_SHA" \
            '{ref: "main", inputs: {target_sha: $target_sha}}')"

          printf '%s' "$CI_PAYLOAD" |
            gh api --method POST \
              "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/dispatches" \
              --input -
          printf '%s' "$SECURITY_PAYLOAD" |
            gh api --method POST \
              "repos/${GITHUB_REPOSITORY}/actions/workflows/security.yml/dispatches" \
              --input -

          CI_RUN_ID=""
          SECURITY_RUN_ID=""
          for attempt in $(seq 1 15); do
            CI_RUN_ID="$(latest_dispatch_run_id ci.yml)"
            SECURITY_RUN_ID="$(latest_dispatch_run_id security.yml)"

            if [[ -n "$CI_RUN_ID" && "$CI_RUN_ID" != "$PRE_CI_RUN_ID" && \
                  -n "$SECURITY_RUN_ID" && "$SECURITY_RUN_ID" != "$PRE_SECURITY_RUN_ID" ]]; then
              break
            fi

            echo "Waiting for dispatched release gates: attempt ${attempt}/15"
            sleep 2
          done

          [[ -n "$CI_RUN_ID" && "$CI_RUN_ID" != "$PRE_CI_RUN_ID" ]] || {
            echo "::error::GitHub did not create a new Full Release CI run for $RELEASE_SHA"
            exit 1
          }
          [[ -n "$SECURITY_RUN_ID" && "$SECURITY_RUN_ID" != "$PRE_SECURITY_RUN_ID" ]] || {
            echo "::error::GitHub did not create a new Security Scanning run for $RELEASE_SHA"
            exit 1
          }

          CI_RUN_URL="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${CI_RUN_ID}"
          SECURITY_RUN_URL="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${SECURITY_RUN_ID}"
          {
            echo "### Release gates dispatched"
            echo "- Full Release CI: ${CI_RUN_URL}"
            echo "- Security Scanning: ${SECURITY_RUN_URL}"
            echo "- Release SHA: \`${RELEASE_SHA}\`"
            echo "- Validated source SHA: \`${SOURCE_SHA}\`"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "Confirmed Full Release CI run: $CI_RUN_URL"
          echo "Confirmed Security Scanning run: $SECURITY_RUN_URL"

      - name: Release status
        if: steps.release_commit.outputs.skip_release == 'true'
        run: echo "Skipping Semantic Release for version commit with [skip ci]"

      - name: Stale source status
        if: steps.source_gate.outputs.stale == 'true'
        run: echo "Skipping Semantic Release because a newer main commit exists"
