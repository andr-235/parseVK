name: One-shot contracts import formatter

on:
  push:
    branches:
      - feature/pr01-parsevk-contracts

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: feature/pr01-parsevk-contracts
          persist-credentials: true

      - name: Setup uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5

      - name: Sort contracts test imports
        shell: bash
        run: |
          set -euo pipefail
          uvx ruff check --fix --select I \
            --config libs/py/contracts/pyproject.toml \
            libs/py/contracts/tests

          unexpected="$(git diff --name-only | grep -v '^libs/py/contracts/tests/' || true)"
          if [[ -n "$unexpected" ]]; then
            echo "::error::Formatter changed unexpected files:"
            printf '%s\n' "$unexpected"
            exit 1
          fi

          if git diff --quiet; then
            echo "No import changes required."
            exit 0
          fi

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add libs/py/contracts/tests
          git commit -m 'style(contracts): sort test imports'
          git push origin HEAD:feature/pr01-parsevk-contracts
