name: Reusable Publish Production Image

on:
  workflow_call:
    inputs:
      service:
        description: Service catalog name
        required: true
        type: string
      dockerfile:
        description: Dockerfile path
        required: true
        type: string
      image_repository:
        description: GHCR image repository without tag
        required: true
        type: string
      target_sha:
        description: Validated semantic-release commit SHA
        required: true
        type: string
      build_args:
        description: Optional newline-delimited Docker build arguments
        required: false
        type: string
        default: ""

permissions:
  contents: read
  packages: write
  attestations: write
  id-token: write

jobs:
  publish:
    name: Publish ${{ inputs.service }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Validate immutable release inputs
        env:
          TARGET_SHA: ${{ inputs.target_sha }}
          IMAGE_REPOSITORY: ${{ inputs.image_repository }}
        run: |
          set -euo pipefail
          [[ "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]] || {
            echo "::error::target_sha must be a full commit SHA"
            exit 1
          }
          [[ "$IMAGE_REPOSITORY" =~ ^ghcr\.io/[a-z0-9._-]+/[a-z0-9._/-]+$ ]] || {
            echo "::error::image_repository must be a lowercase GHCR repository"
            exit 1
          }

      - name: Checkout validated release
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.target_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Reject superseded release
        shell: bash
        env:
          TARGET_SHA: ${{ inputs.target_sha }}
        run: |
          set -euo pipefail
          MAIN_SHA="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          git fetch --no-tags origin "$MAIN_SHA"
          RELEASE_JSON="$(python3 .github/scripts/latest_release.py --ref "$MAIN_SHA")"
          LATEST_RELEASE_SHA="$(jq -r '.release_sha' <<<"$RELEASE_JSON")"
          if [[ "$LATEST_RELEASE_SHA" != "$TARGET_SHA" ]]; then
            echo "::error::Refusing stale image $TARGET_SHA; latest release is $LATEST_RELEASE_SHA, main is $MAIN_SHA"
            exit 1
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish immutable image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ inputs.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: ${{ inputs.image_repository }}:sha-${{ inputs.target_sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ inputs.target_sha }}
            org.opencontainers.image.version=sha-${{ inputs.target_sha }}
            org.opencontainers.image.title=parseVK ${{ inputs.service }}
          build-args: ${{ inputs.build_args }}
          cache-from: type=gha,scope=production-${{ inputs.service }}
          cache-to: type=gha,mode=max,scope=production-${{ inputs.service }}
          provenance: mode=max
          sbom: true

      - name: Write digest metadata
        env:
          SERVICE: ${{ inputs.service }}
          IMAGE_REPOSITORY: ${{ inputs.image_repository }}
          TARGET_SHA: ${{ inputs.target_sha }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || {
            echo "::error::Buildx did not return a valid image digest"
            exit 1
          }
          docker buildx imagetools inspect "${IMAGE_REPOSITORY}@${DIGEST}" >/dev/null
          mkdir -p "$RUNNER_TEMP/image-metadata"
          jq -n \
            --arg service "$SERVICE" \
            --arg repository "$IMAGE_REPOSITORY" \
            --arg tag "${IMAGE_REPOSITORY}:sha-${TARGET_SHA}" \
            --arg digest "$DIGEST" \
            --arg reference "${IMAGE_REPOSITORY}@${DIGEST}" \
            --arg commit_sha "$TARGET_SHA" \
            '{service:$service,repository:$repository,tag:$tag,digest:$digest,reference:$reference,commit_sha:$commit_sha}' \
            > "$RUNNER_TEMP/image-metadata/${SERVICE}.json"

      - name: Upload image metadata
        uses: actions/upload-artifact@v7
        with:
          name: published-image-${{ inputs.service }}-${{ inputs.target_sha }}
          path: ${{ runner.temp }}/image-metadata/${{ inputs.service }}.json
          if-no-files-found: error
          retention-days: 90
