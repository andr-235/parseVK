name: Security Scanning

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      target_sha:
        description: Exact release commit SHA to scan
        required: true
        type: string
  schedule:
    - cron: "0 0 * * 1"

permissions:
  contents: read
  security-events: write
  statuses: write

jobs:
  catalog:
    name: Build Security Matrices
    runs-on: ubuntu-latest
    outputs:
      audit_matrix: ${{ steps.audit.outputs.value }}
      docker_matrix: ${{ steps.docker.outputs.value }}
      docker_changed: ${{ steps.docker.outputs.changed }}
    steps:
      - name: Mark release Security pending
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_SHA: ${{ inputs.target_sha }}
        run: |
          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/statuses/${TARGET_SHA}" \
            -f state=pending \
            -f context=release/security \
            -f description="Release Security is running" \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

      - name: Checkout trusted release resolver
        if: github.event_name == 'workflow_dispatch'
        uses: actions/checkout@v6
        with:
          ref: ${{ github.workflow_sha }}
          sparse-checkout: |
            .github/scripts/latest_release.py
          sparse-checkout-cone-mode: false
          persist-credentials: false
          path: trusted-release-resolver

      - name: Stage trusted release resolver
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: cp trusted-release-resolver/.github/scripts/latest_release.py "$RUNNER_TEMP/latest_release.py"

      - name: Checkout security target
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.target_sha || github.sha }}

      - name: Verify dispatched security target
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          TARGET_SHA: ${{ inputs.target_sha }}
        run: |
          set -euo pipefail
          ACTUAL_SHA="$(git rev-parse HEAD)"
          CURRENT_MAIN="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          [[ "$ACTUAL_SHA" == "$TARGET_SHA" ]] || {
            echo "::error::Dispatched Security checked out $ACTUAL_SHA, expected $TARGET_SHA"
            exit 1
          }

          git fetch --no-tags origin "$CURRENT_MAIN"
          RELEASE_JSON="$(python3 "$RUNNER_TEMP/latest_release.py" --ref "$CURRENT_MAIN")"
          LATEST_RELEASE_SHA="$(jq -r '.release_sha' <<<"$RELEASE_JSON")"
          [[ "$LATEST_RELEASE_SHA" == "$TARGET_SHA" ]] || {
            echo "::error::Dispatched Security target is stale: target=$TARGET_SHA latest_release=$LATEST_RELEASE_SHA main=$CURRENT_MAIN"
            exit 1
          }

      - name: Build Python audit matrix
        id: audit
        run: |
          python3 .github/scripts/service_catalog.py matrix \
            --purpose audit \
            --all \
            --github-output "$GITHUB_OUTPUT"

      - name: Build Docker image matrix
        id: docker
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            BASE_SHA="${{ github.event.pull_request.base.sha }}"
            HEAD_SHA="${{ github.event.pull_request.head.sha }}"
            python3 .github/scripts/service_catalog.py matrix \
              --purpose docker \
              --base "$BASE_SHA" \
              --head "$HEAD_SHA" \
              --github-output "$GITHUB_OUTPUT"
          else
            python3 .github/scripts/service_catalog.py matrix \
              --purpose docker \
              --all \
              --github-output "$GITHUB_OUTPUT"
          fi

  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.target_sha || github.sha }}
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high

  dependency-scan:
    name: Scan Frontend Dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.target_sha || github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Scan Frontend production dependencies
        id: scan-frontend
        working-directory: front
        run: |
          set -euo pipefail
          bun install --frozen-lockfile

          set +e
          bun audit --prod --json > audit-frontend.json
          AUDIT_EXIT=$?
          set -e

          jq empty audit-frontend.json
          CRITICAL_COUNT=$(jq '[to_entries[] | select((.value | type) == "array") | .value[] | select(.severity == "critical")] | length' audit-frontend.json)
          HIGH_COUNT=$(jq '[to_entries[] | select((.value | type) == "array") | .value[] | select(.severity == "high")] | length' audit-frontend.json)

          echo "critical=$CRITICAL_COUNT" >> "$GITHUB_OUTPUT"
          echo "high=$HIGH_COUNT" >> "$GITHUB_OUTPUT"
          echo "Frontend production audit: critical=$CRITICAL_COUNT high=$HIGH_COUNT"

          if [ "$AUDIT_EXIT" -ne 0 ] && [ "$CRITICAL_COUNT" -eq 0 ] && [ "$HIGH_COUNT" -eq 0 ]; then
            echo "::error::bun audit failed without a valid vulnerability report"
            exit "$AUDIT_EXIT"
          fi

      - name: Upload Frontend audit results
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: frontend-audit-results
          path: front/audit-frontend.json
          if-no-files-found: ignore

      - name: Fail on critical vulnerabilities
        if: steps.scan-frontend.outputs.critical > 0
        run: |
          echo "Critical frontend vulnerabilities: ${{ steps.scan-frontend.outputs.critical }}"
          echo "High frontend vulnerabilities: ${{ steps.scan-frontend.outputs.high }}"
          exit 1

  python-dependency-scan:
    name: Audit Python service dependencies
    needs: catalog
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        service: ${{ fromJSON(needs.catalog.outputs.audit_matrix) }}
    uses: ./.github/workflows/reusable-python-security.yml
    with:
      service: ${{ matrix.service }}

  docker-scan:
    name: Scan Docker images
    needs: catalog
    if: needs.catalog.outputs.docker_changed == 'true'
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix: ${{ fromJSON(needs.catalog.outputs.docker_matrix) }}
    permissions:
      contents: read
      security-events: write
    uses: ./.github/workflows/reusable-docker-security.yml
    with:
      service: ${{ matrix.service }}
      dockerfile: ${{ matrix.dockerfile }}
      image: ${{ matrix.image }}
      build_args: ${{ matrix.service == 'frontend' && 'VITE_APP_TITLE=Центр аналитики\nVITE_API_URL=/api\nVITE_API_WS_URL=auto\nVITE_DEV_MODE=false' || '' }}

  secret-scan:
    name: Scan for Secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: ${{ github.event_name == 'workflow_dispatch' && 2 || 0 }}
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.target_sha || github.sha }}

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          config-path: .gitleaksignore
          no-git: false
          exit-code: 1
          redact: true

  security-gate:
    name: Security Gate
    runs-on: ubuntu-latest
    if: always()
    needs:
      - catalog
      - dependency-review
      - dependency-scan
      - python-dependency-scan
      - docker-scan
      - secret-scan
    steps:
      - name: Enforce security workflow integrity
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_SHA: ${{ inputs.target_sha }}
          EVENT_NAME: ${{ github.event_name }}
          DOCKER_CHANGED: ${{ needs.catalog.outputs.docker_changed }}
          CATALOG_RESULT: ${{ needs.catalog.result }}
          DEPENDENCY_REVIEW_RESULT: ${{ needs.dependency-review.result }}
          DEPENDENCY_SCAN_RESULT: ${{ needs.dependency-scan.result }}
          PYTHON_SCAN_RESULT: ${{ needs.python-dependency-scan.result }}
          DOCKER_SCAN_RESULT: ${{ needs.docker-scan.result }}
          SECRET_SCAN_RESULT: ${{ needs.secret-scan.result }}
        run: |
          set -euo pipefail
          failures=0

          require_success() {
            local name="$1"
            local result="$2"
            if [ "$result" != "success" ]; then
              echo "::error::${name} завершён со статусом ${result}"
              failures=$((failures + 1))
            fi
          }

          require_conditional() {
            local name="$1"
            local expected="$2"
            local result="$3"
            if [ "$expected" = "true" ]; then
              require_success "$name" "$result"
            elif [ "$result" != "success" ] && [ "$result" != "skipped" ]; then
              echo "::error::${name} завершён со статусом ${result}"
              failures=$((failures + 1))
            fi
          }

          require_success "Build Security Matrices" "$CATALOG_RESULT"

          if [ "$EVENT_NAME" = "pull_request" ]; then
            require_success "Dependency Review" "$DEPENDENCY_REVIEW_RESULT"
          elif [ "$DEPENDENCY_REVIEW_RESULT" != "skipped" ]; then
            echo "::error::Dependency Review должен быть skipped для события ${EVENT_NAME}, получено ${DEPENDENCY_REVIEW_RESULT}"
            failures=$((failures + 1))
          fi

          require_success "Frontend dependency scan" "$DEPENDENCY_SCAN_RESULT"
          require_success "Python dependency scan" "$PYTHON_SCAN_RESULT"
          require_conditional "Docker image scan" "$DOCKER_CHANGED" "$DOCKER_SCAN_RESULT"
          require_success "Secret scan" "$SECRET_SCAN_RESULT"

          status_state=success
          status_description="Release Security passed"
          if (( failures > 0 )); then
            status_state=failure
            status_description="Release Security failed (${failures} groups)"
          fi

          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            gh api --method POST \
              "repos/${GITHUB_REPOSITORY}/statuses/${TARGET_SHA}" \
              -f state="$status_state" \
              -f context=release/security \
              -f description="$status_description" \
              -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          fi

          if (( failures > 0 )); then
            echo "::error::Security Gate заблокирован: ${failures} проверок не пройдены."
            exit 1
          fi

          echo "Security Gate пройден для commit ${{ github.sha }}"
