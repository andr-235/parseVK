name: Security Scanning

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  schedule:
    - cron: "0 0 * * 1"

permissions:
  contents: read
  security-events: write

jobs:
  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high

  dependency-scan:
    name: Scan Dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Scan Frontend production dependencies
        id: scan-frontend
        working-directory: front
        run: |
          set -euo pipefail
          bun install --frozen-lockfile

          set +e
          bun audit --prod --json > audit-frontend.json
          AUDIT_EXIT=$?
          set -e

          jq empty audit-frontend.json
          CRITICAL_COUNT=$(jq '[to_entries[] | select((.value | type) == "array") | .value[] | select(.severity == "critical")] | length' audit-frontend.json)
          HIGH_COUNT=$(jq '[to_entries[] | select((.value | type) == "array") | .value[] | select(.severity == "high")] | length' audit-frontend.json)

          echo "critical=$CRITICAL_COUNT" >> "$GITHUB_OUTPUT"
          echo "high=$HIGH_COUNT" >> "$GITHUB_OUTPUT"
          echo "Frontend production audit: critical=$CRITICAL_COUNT high=$HIGH_COUNT"

          if [ "$AUDIT_EXIT" -ne 0 ] && [ "$CRITICAL_COUNT" -eq 0 ] && [ "$HIGH_COUNT" -eq 0 ]; then
            echo "::error::bun audit failed without a valid vulnerability report"
            exit "$AUDIT_EXIT"
          fi

      - name: Upload Frontend audit results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: frontend-audit-results
          path: front/audit-frontend.json
          if-no-files-found: ignore

      - name: Fail on critical vulnerabilities
        if: steps.scan-frontend.outputs.critical > 0
        run: |
          echo "Critical frontend vulnerabilities: ${{ steps.scan-frontend.outputs.critical }}"
          echo "High frontend vulnerabilities: ${{ steps.scan-frontend.outputs.high }}"
          exit 1

  python-dependency-scan:
    name: Scan Python Dependencies
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - api-gateway
          - identity-service
          - tasks-service
          - vk-service
          - content-service
          - moderation-service
          - telegram-service
          - im-service
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Audit Python dependencies (${{ matrix.service }})
        working-directory: services/${{ matrix.service }}
        run: |
          set -euo pipefail
          uv sync --frozen
          if ! uv audit --frozen --no-dev; then
            echo "::warning::Python dependency findings detected in ${{ matrix.service }}; currently advisory until the existing backlog is fixed."
          fi

  docker-scan:
    name: Scan Docker Images
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Detect changed files
        id: detect-changes
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE_SHA="${{ github.event.pull_request.base.sha }}"
            HEAD_SHA="${{ github.sha }}"
          else
            BASE_SHA="${{ github.event.before }}"
            HEAD_SHA="${{ github.sha }}"
          fi

          FRONTEND_CHANGED=false

          if [ -z "$BASE_SHA" ] || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            FRONTEND_CHANGED=true
          else
            CHANGED_FILES=$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")
            if echo "$CHANGED_FILES" | grep -qE '^front/|^docker/frontend\.Dockerfile|^docker/frontend-entrypoint\.sh|^docker/frontend\.nginx\.conf'; then
              FRONTEND_CHANGED=true
            fi
          fi

          echo "frontend_changed=$FRONTEND_CHANGED" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Frontend image for scanning
        id: build-frontend
        if: steps.detect-changes.outputs.frontend_changed == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/frontend.Dockerfile
          push: false
          load: true
          tags: parsevk-frontend:scan
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VITE_APP_TITLE=Центр аналитики
            VITE_API_URL=/api
            VITE_API_WS_URL=auto
            VITE_DEV_MODE=false

      - name: Run Trivy vulnerability scanner on Frontend image
        if: steps.build-frontend.outcome == 'success'
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: parsevk-frontend:scan
          format: "sarif"
          output: "trivy-frontend-results.sarif"
          severity: "CRITICAL,HIGH"

      - name: Upload Trivy results to GitHub Security (Frontend)
        if: always() && steps.build-frontend.outcome == 'success'
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: "trivy-frontend-results.sarif"
          wait-for-processing: false

  secret-scan:
    name: Scan for Secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          config-path: .gitleaksignore
          no-git: false
          exit-code: 1
          redact: true

  security-gate:
    name: Security Gate
    runs-on: ubuntu-latest
    if: always()
    needs:
      - dependency-review
      - dependency-scan
      - python-dependency-scan
      - docker-scan
      - secret-scan
    steps:
      - name: Enforce security workflow integrity
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          DEPENDENCY_REVIEW_RESULT: ${{ needs.dependency-review.result }}
          DEPENDENCY_SCAN_RESULT: ${{ needs.dependency-scan.result }}
          PYTHON_SCAN_RESULT: ${{ needs.python-dependency-scan.result }}
          DOCKER_SCAN_RESULT: ${{ needs.docker-scan.result }}
          SECRET_SCAN_RESULT: ${{ needs.secret-scan.result }}
        run: |
          set -euo pipefail
          failures=0

          require_success() {
            local name="$1"
            local result="$2"
            if [ "$result" != "success" ]; then
              echo "::error::${name} завершён со статусом ${result}"
              failures=$((failures + 1))
            fi
          }

          if [ "$EVENT_NAME" = "pull_request" ]; then
            require_success "Dependency Review" "$DEPENDENCY_REVIEW_RESULT"
          elif [ "$DEPENDENCY_REVIEW_RESULT" != "skipped" ]; then
            echo "::error::Dependency Review должен быть skipped для события ${EVENT_NAME}, получено ${DEPENDENCY_REVIEW_RESULT}"
            failures=$((failures + 1))
          fi

          require_success "Frontend dependency scan" "$DEPENDENCY_SCAN_RESULT"
          require_success "Python dependency scan" "$PYTHON_SCAN_RESULT"
          require_success "Docker image scan" "$DOCKER_SCAN_RESULT"
          require_success "Secret scan" "$SECRET_SCAN_RESULT"

          if (( failures > 0 )); then
            echo "::error::Security Gate заблокирован: ${failures} проверок не пройдены."
            exit 1
          fi

          echo "Security Gate пройден для commit ${{ github.sha }}"
