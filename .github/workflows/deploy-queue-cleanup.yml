name: Clean Superseded Production Deploys

on:
  workflow_run:
    workflows: ["Publish Release Images"]
    types:
      - completed
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: production-deploy-queue-cleanup
  cancel-in-progress: true

jobs:
  cleanup:
    name: Cancel Superseded Queued Deploys
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == 'main'
      )
    steps:
      - name: Checkout trusted queue cleanup
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
          sparse-checkout: |
            .github/scripts/latest_release.py
            .github/scripts/cancel-superseded-deploys.sh
          sparse-checkout-cone-mode: false

      - name: Resolve current semantic release
        id: release
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          RELEASE_JSON="$(python .github/scripts/latest_release.py --ref HEAD)"
          RELEASE_SHA="$(jq -r '.release_sha' <<<"$RELEASE_JSON")"

          if [[ "$EVENT_NAME" == "workflow_run" && "$SOURCE_SHA" != "$RELEASE_SHA" ]]; then
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            echo "Publisher release $SOURCE_SHA is stale; latest release is $RELEASE_SHA"
            exit 0
          fi

          echo "proceed=true" >> "$GITHUB_OUTPUT"
          echo "release_sha=$RELEASE_SHA" >> "$GITHUB_OUTPUT"

      - name: Cancel safe superseded deploy runs
        if: steps.release.outputs.proceed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_SHA: ${{ steps.release.outputs.release_sha }}
        run: bash .github/scripts/cancel-superseded-deploys.sh
