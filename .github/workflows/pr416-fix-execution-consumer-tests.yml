name: Patch PR416 execution consumer fixtures

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/pr416-fix-execution-consumer-tests.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Align SQL mocks and UUID TaskRun ids
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("services/tasks-service/tests/test_execution_consumer.py")
          text = path.read_text()
          text = text.replace(
              '"run-42"',
              '"00000000-0000-0000-0000-000000000042"',
          )
          text = text.replace(
              '"run-expected"',
              '"00000000-0000-0000-0000-000000000043"',
          )
          text = text.replace(
              '"run-wrong"',
              '"00000000-0000-0000-0000-000000000044"',
          )
          text = text.replace(
              '''    results.extend([_mock_result_task_row(row), MagicMock()])
          ''',
              '''    results.extend(
                  [_mock_result_task_row(row), *[MagicMock() for _ in range(4)]]
              )
          ''',
          )
          old = '''    assert session.execute.await_count == 3
              assert session.commit.await_count == 1

              added_models = [call.args[0] for call in session.add.call_args_list]
              state_events = [m for m in added_models if getattr(m, "event_type", None) == "task.state_changed"]
              assert len(state_events) == 1
              assert state_events[0].payload["status"] == "running"
          '''
          new = '''    assert session.execute.await_count == 4
              assert session.commit.await_count == 1

              added_models = [call.args[0] for call in session.add.call_args_list]
              state_events = [
                  model
                  for model in added_models
                  if getattr(model, "event_type", None) == "task.state_changed"
              ]
              assert len(state_events) == 1
              assert state_events[0].payload["status"] == "running"
          '''
          text = text.replace(old, new, 1)
          path.write_text(text)
          PY
          rm .github/workflows/pr416-fix-execution-consumer-tests.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            services/tasks-service/tests/test_execution_consumer.py \
            .github/workflows/pr416-fix-execution-consumer-tests.yml
          git commit -m "test(tasks): account for TaskRun lifecycle writes"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
