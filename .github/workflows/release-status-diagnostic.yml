name: Release Status Diagnostic

on:
  push:
    branches:
      - diagnostics/release-0.85.1

permissions:
  actions: read
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: diagnostics/release-0.85.1
          fetch-depth: 1

      - name: Inspect deploy dispatch attempt
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_SHA: e786ff4db76707a500e3f3935f54400465af7191
        run: |
          set -euo pipefail
          mkdir -p diagnostics
          gh api --method GET "repos/${GITHUB_REPOSITORY}/actions/workflows/release-status-diagnostic.yml/runs" -f per_page=20 > /tmp/diagnostic-runs.json
          gh api --method GET "repos/${GITHUB_REPOSITORY}/actions/workflows/deploy.yml/runs" -f per_page=20 > /tmp/deploy-runs.json
          jq -n \
            --arg release_sha "$RELEASE_SHA" \
            --slurpfile diagnostic /tmp/diagnostic-runs.json \
            --slurpfile deploy /tmp/deploy-runs.json \
            '{
              release_sha: $release_sha,
              diagnostic_runs: [$diagnostic[0].workflow_runs[] | {id,event,status,conclusion,head_sha,head_branch,html_url,created_at,updated_at}],
              deploy_runs: [$deploy[0].workflow_runs[] | {id,event,status,conclusion,head_sha,head_branch,html_url,created_at,updated_at}]
            }' > diagnostics/release-0.85.2-dispatch-attempt.json

      - name: Commit diagnostic result
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email github-actions[bot]@users.noreply.github.com
          git add diagnostics/release-0.85.2-dispatch-attempt.json
          git commit -m "chore(diagnostics): record deploy dispatch attempt"
          git push origin HEAD:diagnostics/release-0.85.1
