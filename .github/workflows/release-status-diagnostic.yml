name: Release Status Diagnostic

on:
  push:
    branches:
      - diagnostics/release-0.85.1

permissions:
  actions: write
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: diagnostics/release-0.85.1
          fetch-depth: 1

      - name: Dispatch protected production deploy
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_SHA: e786ff4db76707a500e3f3935f54400465af7191
        run: |
          set -euo pipefail
          mkdir -p diagnostics

          latest_run_id() {
            gh api --method GET "repos/${GITHUB_REPOSITORY}/actions/workflows/deploy.yml/runs" \
              -f branch=main \
              -f event=workflow_dispatch \
              -f per_page=20 \
              --jq --arg sha "$RELEASE_SHA" '[.workflow_runs[] | select(.head_sha == $sha)] | sort_by(.created_at) | last | .id // empty'
          }

          PRE_RUN_ID="$(latest_run_id)"
          jq -nc '{ref:"main",inputs:{deployment:"current-main"}}' |
            gh api --method POST "repos/${GITHUB_REPOSITORY}/actions/workflows/deploy.yml/dispatches" --input -

          RUN_ID=""
          for attempt in $(seq 1 20); do
            RUN_ID="$(latest_run_id)"
            if [[ -n "$RUN_ID" && "$RUN_ID" != "$PRE_RUN_ID" ]]; then
              break
            fi
            sleep 2
          done

          [[ -n "$RUN_ID" && "$RUN_ID" != "$PRE_RUN_ID" ]] || {
            echo "::error::GitHub did not create a new production deploy run"
            exit 1
          }

          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}" \
            --jq '{release_sha: env.RELEASE_SHA, deploy: {id,name,event,status,conclusion,head_sha,head_branch,html_url,created_at,updated_at}}' \
            > diagnostics/release-0.85.2-manual-deploy.json

      - name: Commit diagnostic result
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email github-actions[bot]@users.noreply.github.com
          git add diagnostics/release-0.85.2-manual-deploy.json
          git commit -m "chore(diagnostics): record production deploy run"
          git push origin HEAD:diagnostics/release-0.85.1
