name: Generate AI review comment cleanup

on:
  pull_request:
    branches:
      - main
    types: [synchronize]
    paths:
      - .github/workflows/generate-ai-review-comment-cleanup.yml

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: test/ai-review-e2e
          fetch-depth: 0

      - name: Generate workflow
        shell: bash
        run: |
          set -euo pipefail
          python .github/scripts/patch_ai_review_comment_cleanup.py
          mkdir -p .github/generated
          cp .github/workflows/ai-code-review.yml .github/generated/ai-code-review.yml
          git restore .github/workflows/ai-code-review.yml

      - name: Commit generated blob
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/generated/ai-code-review.yml
          git commit -m "chore: generate AI review comment cleanup"
          git push origin HEAD:test/ai-review-e2e
