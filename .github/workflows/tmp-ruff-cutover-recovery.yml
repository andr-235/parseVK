name: Temporary Ruff Cutover Fix

on:
  push:
    branches:
      - fix/p2-cutover-recovery

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v5
      - name: Apply Ruff import ordering
        run: |
          set -euo pipefail
          uvx ruff check --fix services/vk-service/tests/test_legacy_outbox_quarantine.py
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add services/vk-service/tests/test_legacy_outbox_quarantine.py
          git commit -m "style(vk): apply Ruff import ordering"
          git push origin HEAD:fix/p2-cutover-recovery
