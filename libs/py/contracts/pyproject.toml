[project]
name = "parsevk-contracts"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.12,<3",
]

[project.optional-dependencies]
generation = [
    "PyYAML>=6,<7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["parsevk_contracts"]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "hypothesis>=6", "jsonschema>=4.20", "pyyaml>=6.0", "types-pyyaml>=6", "mypy>=1.15"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
strict = true
warn_unused_configs = true
show_error_codes = true

[tool.pydantic-mypy]
init_forbid_extra = true
warn_required_dynamic_aliases = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "S"]
ignore = ["S101", "B008", "B017", "E402", "S105", "S106", "S107", "S110", "S310", "S608", "E501"]
per-file-ignores = {"tests/test_validation.py" = ["F821"]}

[tool.ruff.lint.isort]
known-first-party = ["parsevk_contracts"]
