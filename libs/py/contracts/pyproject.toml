[project]
name = "parsevk-contracts"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["parsevk_contracts"]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "hypothesis>=6", "jsonschema>=4.20", "pyyaml>=6.0"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
strict = true
warn_unused_configs = true
show_error_codes = true

[tool.pydantic-mypy]
init_forbid_extra = true
warn_required_dynamic_aliases = true
