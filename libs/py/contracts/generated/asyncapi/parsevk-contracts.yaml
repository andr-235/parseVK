asyncapi: 3.1.0
info:
  title: ParseVK Contracts
  version: 0.1.0
  description: ParseVK Kafka message contracts
defaultContentType: application/json
channels:
  parsevk_content_events:
    address: parsevk.content.events
    messages:
      content_canonical_comments_changed:
        $ref: '#/components/messages/content_canonical_comments_changed'
  parsevk_sources_events:
    address: parsevk.sources.events
    messages:
      sources_access_granted:
        $ref: '#/components/messages/sources_access_granted'
      sources_access_revoked:
        $ref: '#/components/messages/sources_access_revoked'
  parsevk_vk_commands:
    address: parsevk.vk.commands
    messages:
      vk_execution_cancel_requested:
        $ref: '#/components/messages/vk_execution_cancel_requested'
      vk_execution_requested:
        $ref: '#/components/messages/vk_execution_requested'
  parsevk_content_ingestion_vk:
    address: parsevk.content.ingestion.vk
    messages:
      vk_ingestion_comment-part-prepared:
        $ref: '#/components/messages/vk_ingestion_comment-part-prepared'
      vk_ingestion_post-part-prepared:
        $ref: '#/components/messages/vk_ingestion_post-part-prepared'
operations:
  content_service_send_content_canonical_comments_changed:
    action: send
    channel:
      $ref: '#/channels/parsevk_content_events'
    messages:
    - $ref: '#/channels/parsevk_content_events/messages/content_canonical_comments_changed'
  moderation_service_receive_content_canonical_comments_changed:
    action: receive
    channel:
      $ref: '#/channels/parsevk_content_events'
    messages:
    - $ref: '#/channels/parsevk_content_events/messages/content_canonical_comments_changed'
  tasks_service_send_sources_access_granted:
    action: send
    channel:
      $ref: '#/channels/parsevk_sources_events'
    messages:
    - $ref: '#/channels/parsevk_sources_events/messages/sources_access_granted'
  vk_service_receive_sources_access_granted:
    action: receive
    channel:
      $ref: '#/channels/parsevk_sources_events'
    messages:
    - $ref: '#/channels/parsevk_sources_events/messages/sources_access_granted'
  tasks_service_send_sources_access_revoked:
    action: send
    channel:
      $ref: '#/channels/parsevk_sources_events'
    messages:
    - $ref: '#/channels/parsevk_sources_events/messages/sources_access_revoked'
  vk_service_receive_sources_access_revoked:
    action: receive
    channel:
      $ref: '#/channels/parsevk_sources_events'
    messages:
    - $ref: '#/channels/parsevk_sources_events/messages/sources_access_revoked'
  tasks_service_send_vk_execution_cancel_requested:
    action: send
    channel:
      $ref: '#/channels/parsevk_vk_commands'
    messages:
    - $ref: '#/channels/parsevk_vk_commands/messages/vk_execution_cancel_requested'
  vk_service_receive_vk_execution_cancel_requested:
    action: receive
    channel:
      $ref: '#/channels/parsevk_vk_commands'
    messages:
    - $ref: '#/channels/parsevk_vk_commands/messages/vk_execution_cancel_requested'
  tasks_service_send_vk_execution_requested:
    action: send
    channel:
      $ref: '#/channels/parsevk_vk_commands'
    messages:
    - $ref: '#/channels/parsevk_vk_commands/messages/vk_execution_requested'
  vk_service_receive_vk_execution_requested:
    action: receive
    channel:
      $ref: '#/channels/parsevk_vk_commands'
    messages:
    - $ref: '#/channels/parsevk_vk_commands/messages/vk_execution_requested'
  vk_service_send_vk_ingestion_comment-part-prepared:
    action: send
    channel:
      $ref: '#/channels/parsevk_content_ingestion_vk'
    messages:
    - $ref: '#/channels/parsevk_content_ingestion_vk/messages/vk_ingestion_comment-part-prepared'
  content_service_receive_vk_ingestion_comment-part-prepared:
    action: receive
    channel:
      $ref: '#/channels/parsevk_content_ingestion_vk'
    messages:
    - $ref: '#/channels/parsevk_content_ingestion_vk/messages/vk_ingestion_comment-part-prepared'
  vk_service_send_vk_ingestion_post-part-prepared:
    action: send
    channel:
      $ref: '#/channels/parsevk_content_ingestion_vk'
    messages:
    - $ref: '#/channels/parsevk_content_ingestion_vk/messages/vk_ingestion_post-part-prepared'
  content_service_receive_vk_ingestion_post-part-prepared:
    action: receive
    channel:
      $ref: '#/channels/parsevk_content_ingestion_vk'
    messages:
    - $ref: '#/channels/parsevk_content_ingestion_vk/messages/vk_ingestion_post-part-prepared'
components:
  messages:
    content_canonical_comments_changed:
      name: content.canonical_comments_changed
      title: content.canonical_comments_changed
      summary: content.canonical_comments_changed
      contentType: application/json
      payload:
        $ref: ../json-schema/content.canonical_comments_changed.json
    sources_access_granted:
      name: sources.access.granted
      title: sources.access.granted
      summary: sources.access.granted
      contentType: application/json
      payload:
        $ref: ../json-schema/sources.access.granted.json
    sources_access_revoked:
      name: sources.access.revoked
      title: sources.access.revoked
      summary: sources.access.revoked
      contentType: application/json
      payload:
        $ref: ../json-schema/sources.access.revoked.json
    vk_execution_cancel_requested:
      name: vk.execution.cancel_requested
      title: vk.execution.cancel_requested
      summary: vk.execution.cancel_requested
      contentType: application/json
      payload:
        $ref: ../json-schema/vk.execution.cancel_requested.json
    vk_execution_requested:
      name: vk.execution.requested
      title: vk.execution.requested
      summary: vk.execution.requested
      contentType: application/json
      payload:
        $ref: ../json-schema/vk.execution.requested.json
    vk_ingestion_comment-part-prepared:
      name: vk.ingestion.comment-part-prepared
      title: vk.ingestion.comment-part-prepared
      summary: vk.ingestion.comment-part-prepared
      contentType: application/json
      payload:
        $ref: ../json-schema/vk.ingestion.comment-part-prepared.json
    vk_ingestion_post-part-prepared:
      name: vk.ingestion.post-part-prepared
      title: vk.ingestion.post-part-prepared
      summary: vk.ingestion.post-part-prepared
      contentType: application/json
      payload:
        $ref: ../json-schema/vk.ingestion.post-part-prepared.json
